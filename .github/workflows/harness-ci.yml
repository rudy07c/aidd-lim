name: Harness CI

on:
  push:
    paths:
      - 'harness/**'
      - 'calibration/**'
      - 'synthetic-world/**'
      - '.github/workflows/harness-ci.yml'
  pull_request:
    paths:
      - 'harness/**'
      - 'calibration/**'
      - 'synthetic-world/**'
      - '.github/workflows/harness-ci.yml'

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            harness/package-lock.json
            calibration/package-lock.json
            synthetic-world/package-lock.json
      - name: Install harness dependencies
        working-directory: harness
        run: npm ci
      - name: Install calibration dependencies
        working-directory: calibration
        run: npm ci
      - name: Install synthetic-world dependencies
        working-directory: synthetic-world
        run: npm ci
      - name: Typecheck harness
        working-directory: harness
        run: npm run typecheck
      - name: Typecheck calibration
        working-directory: calibration
        run: npm run typecheck
      - name: Verify synthetic-world tests
        working-directory: synthetic-world
        run: npm test -- --runInBand
      - name: Verify Stage 1 context condition metadata
        working-directory: harness
        run: npm run verify:context-conditions
      - name: Verify P2 observable interaction runtime
        working-directory: harness
        run: npm run verify:observable-interaction
      - name: Verify P4 WorkingSetManager steps 1-3
        working-directory: harness
        run: npm run verify:working-set
      - name: Verify P3 measurement repair
        working-directory: calibration
        run: npm run verify:p3
      - name: Smoke Stage 1 calibration probe bank
        working-directory: calibration
        run: npx ts-node src/calibration-runner.ts --backend=mock-noop --budgets=0 --tasks=T-local-1 --probe-bank=stage1
      - name: Verify run validity semantics
        working-directory: harness
        run: npm run verify:run-validity
      - name: Verify OpenAI backend offline
        working-directory: harness
        run: npm run verify:openai
      - name: Verify OpenAI Batch runner offline
        working-directory: harness
        run: npm run verify:openai-batch
      - name: Smoke Stage 0 mock-noop legacy full config
        working-directory: harness
        run: npm run run -- --config config/stage0-mock.json --smoke
      - name: Smoke Stage 0 mock-noop legacy simple-limited config
        working-directory: harness
        run: npm run run -- --config config/stage0-mock-limited.json --smoke
      - name: Smoke Stage 0 mock-oracle legacy full config
        working-directory: harness
        run: npm run run -- --config config/stage0-oracle.json --smoke
      - name: Smoke Stage 0 mock-oracle legacy simple-limited config
        working-directory: harness
        run: npm run run -- --config config/stage0-oracle-limited.json --smoke
