name: Harness CI

on:
  push:
    paths:
      - 'harness/**'
      - 'calibration/**'
      - 'synthetic-world/**'
      - '.github/workflows/harness-ci.yml'
  pull_request:
    paths:
      - 'harness/**'
      - 'calibration/**'
      - 'synthetic-world/**'
      - '.github/workflows/harness-ci.yml'

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            harness/package-lock.json
            calibration/package-lock.json
            synthetic-world/package-lock.json
      - name: Install harness dependencies
        working-directory: harness
        run: npm ci
      - name: Install calibration dependencies
        working-directory: calibration
        run: npm ci
      - name: Install synthetic-world dependencies
        working-directory: synthetic-world
        run: npm ci
      - name: Typecheck harness
        working-directory: harness
        run: npm run typecheck
      - name: Typecheck calibration
        working-directory: calibration
        run: npm run typecheck
      - name: Verify synthetic-world tests
        working-directory: synthetic-world
        run: npm test -- --runInBand
      - name: Verify Stage 1 context condition metadata
        working-directory: harness
        run: npm run verify:context-conditions
      - name: Verify P2 observable interaction runtime
        working-directory: harness
        run: npm run verify:observable-interaction
      - name: Verify P4 WorkingSetManager steps 1-4 FIFO-v1
        working-directory: harness
        run: npm run verify:working-set
      - name: Verify P4 WorkingSetManager step 5 reread
        working-directory: harness
        run: npm run verify:working-set-reread
      - name: Verify P4 step 6 hardened two-phase E_max boundary
        working-directory: harness
        run: npm run verify:exploration-budget
      - name: Verify P4 step 7 research-stateless episodic runner
        working-directory: harness
        run: npm run verify:research-stateless-episode
      - name: Verify P5 step 1 provider-neutral repository accessor
        working-directory: harness
        run: npm run verify:repository-accessor
      - name: Verify P5 AR budgeted retrieval integration
        working-directory: harness
        run: npm run verify:agent-retrieved-runtime
      - name: Verify P5 PR privileged retrieval controller
        working-directory: harness
        run: npm run verify:privileged-retrieval
      - name: Verify P5 PR AR common runtime parity
        working-directory: harness
        run: npm run verify:pr-ar-runtime-parity
      - name: Verify P5.5 PR AR reread capability parity
        working-directory: harness
        run: npm run verify:pr-reread-parity
      - name: Verify P5.5 evidence exhaustion is observable, not exceptional
        working-directory: harness
        run: npm run verify:evidence-exhaustion-signal
      - name: Verify P5 GenerationLog integration
        working-directory: harness
        run: npm run verify:retrieved-generation-logging
      - name: Verify P5.5 failed retrieval logging
        working-directory: harness
        run: npm run verify:p5-5-failure-logging
      - name: Verify P5.5 typed E_max/provider error separation
        working-directory: harness
        run: npm run verify:p5-5-error-separation
      - name: P5.5 PR end-to-end run.ts smoke
        working-directory: harness
        run: |
          npm run run -- --config config/p5_5-pr-mock.json --smoke
          test -f ../runs/_smoke/p5-5-pr-mock-e2e/lineage-0/generation_000/retrieved_episode.json
          node -e 'const x=require("../runs/_smoke/p5-5-pr-mock-e2e/lineage-0/generation_000/retrieved_episode.json"); if(x.condition!=="PR"||x.completion.status!=="completed") process.exit(1)'
      - name: P5.5 AR end-to-end run.ts smoke
        working-directory: harness
        run: |
          npm run run -- --config config/p5_5-ar-mock.json --smoke
          test -f ../runs/_smoke/p5-5-ar-mock-e2e/lineage-0/generation_000/retrieved_episode.json
          node -e 'const x=require("../runs/_smoke/p5-5-ar-mock-e2e/lineage-0/generation_000/retrieved_episode.json"); if(x.condition!=="AR"||x.completion.status!=="completed") process.exit(1)'
      - name: Verify P3 measurement repair
        working-directory: calibration
        run: npm run verify:p3
      - name: Smoke Stage 1 calibration probe bank
        working-directory: calibration
        run: npx ts-node src/calibration-runner.ts --backend=mock-noop --budgets=0 --tasks=T-local-1 --probe-bank=stage1
      - name: Verify run validity semantics
        working-directory: harness
        run: npm run verify:run-validity
      - name: Verify P6 semantic/protocol failure classification
        working-directory: harness
        run: npm run verify:p6-failure-classification
      - name: Verify P6 full task-bank eligibility planning
        working-directory: harness
        run: npm run verify:p6-task-bank-eligibility
      - name: Verify P6 task-bank live runner hardening offline
        working-directory: harness
        run: npm run verify:p6-task-bank-eligibility-runner
      - name: Verify P6-2 AF baseline runner offline
        working-directory: harness
        run: npm run verify:p6-af-baseline
      - name: Verify installed SDK version provenance
        working-directory: harness
        run: npm run verify:package-version
      - name: Verify invariant heldout dependency coverage
        working-directory: harness
        run: npm run verify:heldout-invariant-coverage
      - name: Verify OpenAI backend offline
        working-directory: harness
        run: npm run verify:openai
      - name: Verify OpenAI Batch runner offline
        working-directory: harness
        run: npm run verify:openai-batch
      - name: Smoke Stage 0 mock-noop legacy full config
        working-directory: harness
        run: npm run run -- --config config/stage0-mock.json --smoke
      - name: Smoke Stage 0 mock-noop legacy simple-limited config
        working-directory: harness
        run: npm run run -- --config config/stage0-mock-limited.json --smoke
      - name: Smoke Stage 0 mock-oracle legacy full config
        working-directory: harness
        run: npm run run -- --config config/stage0-oracle.json --smoke
      - name: Smoke Stage 0 mock-oracle legacy simple-limited config
        working-directory: harness
        run: npm run run -- --config config/stage0-oracle-limited.json --smoke
