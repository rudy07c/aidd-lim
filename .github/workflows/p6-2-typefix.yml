name: P6-2 typefix

on:
  push:
    paths:
      - '.github/p6_2_typefix_trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p6-2-af-baseline-runner
      - name: Apply typefix
        run: python .github/p6_2_typefix.py
      - name: Commit
        run: |
          git config user.name 'rudy07c'
          git config user.email 'rudy07c@gmail.com'
          git add harness/src/p6/af-baseline.ts harness/verify-p6-af-baseline.ts
          git diff --cached --check
          git commit -m 'fix(p6): correct AF baseline verifier types'
          git push origin HEAD:p6-2-af-baseline-runner
