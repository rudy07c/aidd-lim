name: Apply sync review v2.6

on:
  push:
    paths:
      - '.doc-update/apply_sync_review_v26.py'
      - '.github/workflows/apply-sync-review-v26.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update plans
        run: python .doc-update/apply_sync_review_v26.py
      - name: Commit updates and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .doc-update/apply_sync_review_v26.py
          git rm .github/workflows/apply-sync-review-v26.yml
          git add docs/experiment_plan.md docs/stage1_plan.md
          git commit -m "docs: harden sync backend validity requirements"
          git push
