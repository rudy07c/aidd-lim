name: P6-3 v3 Calibration Predeclaration

on:
  push:
    paths:
      - 'harness/src/p6/p6-3-v3-calibration-predeclaration.ts'
      - 'harness/verify-p6-3-v3-calibration-predeclaration.ts'
      - 'harness/frozen/p6-3-el-structural-freeze.json'
      - 'harness/src/p6/p6-3-execution-protocol.ts'
      - 'harness/src/p6/af-baseline.ts'
      - 'harness/src/p6/p6-3-v3-m-executor.ts'
      - 'harness/src/p6/p6-3-v3-rsem-executor.ts'
      - 'harness/src/p6/p6-3-v3-run-start.ts'
      - 'harness/src/context/generation-zero-fixed-environment.ts'
      - 'harness/src/context/fixed-environment-runtime.ts'
      - 'harness/src/context/p6-3-v3-final-static-exposure-selector.ts'
      - 'harness/src/context/p6-3-v3-selector-structural-acceptance.ts'
      - 'harness/src/context/static-exposure.ts'
      - 'harness/src/measurement/token-counter.ts'
      - 'synthetic-world/repository/**'
      - 'docs/p6_3_v3_calibration_predeclaration.md'
      - '.github/workflows/p6-3-v3-calibration-predeclaration-ci.yml'
  pull_request:
    paths:
      - 'harness/src/p6/p6-3-v3-calibration-predeclaration.ts'
      - 'harness/verify-p6-3-v3-calibration-predeclaration.ts'
      - 'harness/frozen/p6-3-el-structural-freeze.json'
      - 'harness/src/p6/p6-3-execution-protocol.ts'
      - 'harness/src/p6/af-baseline.ts'
      - 'harness/src/p6/p6-3-v3-m-executor.ts'
      - 'harness/src/p6/p6-3-v3-rsem-executor.ts'
      - 'harness/src/p6/p6-3-v3-run-start.ts'
      - 'harness/src/context/generation-zero-fixed-environment.ts'
      - 'harness/src/context/fixed-environment-runtime.ts'
      - 'harness/src/context/p6-3-v3-final-static-exposure-selector.ts'
      - 'harness/src/context/p6-3-v3-selector-structural-acceptance.ts'
      - 'harness/src/context/static-exposure.ts'
      - 'harness/src/measurement/token-counter.ts'
      - 'synthetic-world/repository/**'
      - 'docs/p6_3_v3_calibration_predeclaration.md'
      - '.github/workflows/p6-3-v3-calibration-predeclaration-ci.yml'

permissions:
  contents: read

jobs:
  verify-predeclaration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: harness/package-lock.json
      - name: Install harness dependencies
        working-directory: harness
        run: npm ci
      - name: Typecheck harness
        working-directory: harness
        run: npm run typecheck
      - name: Verify P6-3 v3 calibration predeclaration
        working-directory: harness
        run: npx ts-node verify-p6-3-v3-calibration-predeclaration.ts
