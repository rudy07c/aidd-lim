name: P4 Emax Pending Doc Sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p4-emax-pending-doc-sync.yml'

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Document pending retrieval boundary
        run: >-
          python -c 'from pathlib import Path; p=Path("docs/stage1_plan.md"); t=p.read_text(); old="その同一候補をremaining budget内へtrimするか0 tokenでdiscardしてpending retrievalをcloseする。これによりoversized retrievalをfree retryとして反復できない。"; new="その同一候補をremaining budget内へtrimするか0 tokenでdiscardしてpending retrievalをcloseする。pending retrievalが残る間は新規retrievalだけでなくmodel call・次decision roundも開始できないfail-closed境界とする。これによりoversized retrievalをfree retryとして反復したり、未会計candidateを推論へ持ち込んだりできない。"; assert old in t, "pending-boundary text not found"; p.write_text(t.replace(old,new,1))'
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/p4-emax-pending-doc-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/stage1_plan.md .github/workflows/p4-emax-pending-doc-sync.yml
          git commit -m 'docs: enforce pending E_max retrieval boundary'
          git push
