name: One-shot Stage 1 progress docs update

on:
  push:
    paths:
      - '.github/workflows/update-stage1-progress.yml'

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update Stage 1 progress documentation
        shell: bash
        run: |
          echo 'て...snipped...' | base64 -d > /tmp/update_stage1_progress.py
          python /tmp/update_stage1_progress.py
      - name: Commit and push documentation update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/update-stage1-progress.yml
          git add docs/stage1_plan.md docs/experiment_plan.md
          git diff --cached --check
          git commit -m 'docs(stage1): record P5.5 completion and P6 current position'
          git push origin HEAD:main
