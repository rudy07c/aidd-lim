name: One-shot Stage 1 progress docs update

on:
  push:
    paths:
      - '.github/workflows/update-stage1-progress.yml'

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Stage 1 progress documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          stage1_path = Path('docs/stage1_plan.md')
          experiment_path = Path('docs/experiment_plan.md')

          stage1 = stage1_path.read_text()

          completed_headers = [
              ('### Phase P0：Conceptual / Naming Sync', '### Phase P0：Conceptual / Naming Sync ✅ 完了'),
              ('### Phase P1：Backend / Model Migration', '### Phase P1：Backend / Model Migration ✅ 完了'),
              ('### Phase P2：MOI / Observable Interaction', '### Phase P2：MOI / Observable Interaction ✅ 完了'),
              ('### Phase P3：Measurement Repair', '### Phase P3：Measurement Repair ✅ 完了'),
              ('### Phase P4：Working-Set Runtime', '### Phase P4：Working-Set Runtime ✅ 完了'),
              ('### Phase P5：Retrieval / Security', '### Phase P5：Retrieval / Security ✅ 完了'),
          ]
          for old, new in completed_headers:
              if old not in stage1:
                  raise SystemExit(f'missing Stage 1 phase header: {old}')
              stage1 = stage1.replace(old, new, 1)

          p55 = r'''### Phase P5.5：PR / AR Runtime Hardening & Luna Live Smoke ✅ 完了

P5で構築したretrieval/runtimeを、実際のcondition dispatcher・OpenAI実行経路・GenerationLogへ接続し、P6で科学的較正へ入れる状態までhardeningする。

- [x] PR / ARをproductionのcondition dispatcherへ接続し、`run.ts`から実conditionとして起動可能にする
- [x] retrieved episodeの結果を`GenerationLog`へ配線し、retrieval / working-set / completion / error provenanceを世代ログから再構成可能にする
- [x] OpenAI用PR executorを新設し、privileged controller + research-stateless requestでPRを実API実行可能にする
- [x] PR / ARで同一FIFO-v1のreread capabilityを実装・検証し、C2でretrieval policy以外のresource contractを共有する
- [x] evidence exhaustionを例外で潰さず`evidence-exhaustion-signal`として観測可能にする
- [x] failed retrieval loggingと、`E_max`枯渇・provider error・model-originated outcomeのtyped separationを実装する
- [x] `RepositoryAccessor.readChunk()`の`endLine`を実ファイル末尾へclampする契約を修正し、回帰testで固定する
- [x] GPT-5.6 LunaでPR / ARのlive smokeを実施し、research-stateless ARで同一searchを反復するF11を生ログから記録する
- [x] F11をC2のshared resource contractへ同期し、PR / ARで**同一の `B_work`・同一の `E_max`・同一のFIFO-v1**を使うこと、ARの追加探索消費自体をretrieval-policy effectとして扱うことを明文化する
- [x] `searchEmptyAttempts`等のdeterministic episodic bookkeepingがresearch-stateless原則と両立する境界を文書化する

**Gate**：PR / ARが共通C2 resource contract上でproduction dispatcherからend-to-end実行でき、reread・evidence exhaustion・failure semantics・GenerationLogが観測可能である。RepositoryAccessorのclamp契約がtestで固定され、GPT-5.6 Luna live smokeでPR / ARの実行経路を確認済み。F11はretrieval-policy effectとして記録され、P6ではPR / AR共通の`E_max`をrepeatで較正・freezeする方針まで同期済み。

'''
          marker = '### Phase P6：Recalibration\n'
          if marker not in stage1:
              raise SystemExit('missing P6 marker')
          if '### Phase P5.5：' in stage1:
              raise SystemExit('P5.5 already exists')
          stage1 = stage1.replace(marker, p55 + marker, 1)
          stage1_path.write_text(stage1)

          experiment = experiment_path.read_text()
          if '**版**: v2.6' not in experiment:
              raise SystemExit('unexpected experiment plan version')
          experiment = experiment.replace('**版**: v2.6', '**版**: v2.7', 1)

          v27_note = r'''**v2.7での変更点（Pre-Stage 1 P5.5完了・現在地同期）**：
- `docs/stage1_plan.md`の実装順序にP5.5を正式追加し、condition dispatcher接続、GenerationLog配線、OpenAI PR executor、PR/AR reread parity、evidence-exhaustion signal、RepositoryAccessor clamp契約、Luna live smoke、F11記録までを完了済みphaseとして固定
- Pre-Stage 1のP0〜P5.5を完了済み（✅）として明記し、次の実装対象をP6 Recalibrationへ更新
- 現在地を「Stage 1着手前」一般ではなく、**P6着手直前**へ更新。P6では `T_primary / T_challenge`、`B_expose`、`B_work`、PR/AR共通`E_max`等を再較正・freezeする
- F11の解釈をC2のshared resource contractに合わせ、PR/ARは同一`B_work`・同一`E_max`・同一FIFO-v1を共有し、自律探索に伴う追加resource消費をretrieval-policy effectの一部として扱う方針を維持

'''
          anchor = '**v2.6での変更点（OpenAI Sync backend自己レビューによる内部妥当性hardening）**：'
          if anchor not in experiment:
              raise SystemExit('missing v2.6 changelog anchor')
          experiment = experiment.replace(anchor, v27_note + anchor, 1)

          current_state = r'''**v2.7時点の現在地（2026-09-19）**：Stage 0 / 0.5は完了済み。Pre-Stage 1は **P0〜P5.5まで完了**しており、5条件（MOI / AF / EL / PR / AR）の二軸設計、OpenAI backend / Batch経路、MOI observable interaction、balanced measurement、bounded working-set runtime、RepositoryAccessor、PR/AR retrieval runtime、GenerationLog、reread parity、error/evidence-exhaustion semantics、Luna live smokeまで実装・検証済みである。**次の実装対象はPre-Stage 1 P6：Recalibration**であり、旧3条件版のStage 1 Phase 0へ戻らない。

**次の実行順序**：

1. **P6 Recalibration**：Luna capability-floor / AF baselineを再取得し、`T_primary / T_challenge`、`B_expose`、`B_work`、PR/AR共通`E_max`、MOI schema/size、equivalence margin、repeat数をmain comparison前にfreezeする
2. **Stage 1A**：fixed-\(S_0\)でAF / EL / PR / ARを比較し、C1〜C3を診断する
3. **Stage 1B**：同一predecessor fixtureからMOI / AF + sham-historyを比較し、C0 immediate history utilityを診断する
4. **P6.5**：MOI対応Semantic Element Traceをsource-aware化する
5. **P7**：longitudinal evaluatorを累積評価対応へ更新する
6. **Stage 1C**：5条件を10〜15世代通すintegration runを行う
7. Stage 1C完了後、Stage 2 common-environment evaluation / longitudinal pilotへ進む

以下の旧来の①〜⑥は研究装置を構築した履歴として保持するが、現在の実行順序の根拠には使わない。現在地の正本は `docs/stage1_plan.md` の21節と本節で同期する。'''

          pattern = re.compile(r'\*\*v2\.0時点の現在地\*\*：.*?(?=\n\n\*\*方針\*\*)', re.S)
          experiment, count = pattern.subn(current_state, experiment, count=1)
          if count != 1:
              raise SystemExit(f'current-state replacement count={count}')

          experiment_path.write_text(experiment)
          PY

      - name: Commit and push documentation update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/update-stage1-progress.yml
          git add docs/stage1_plan.md docs/experiment_plan.md
          git diff --cached --check
          git commit -m 'docs(stage1): record P5.5 completion and P6 current position'
          git push origin HEAD:main
