name: One-shot experiment plan current-position update

on:
  push:
    paths:
      - '.github/workflows/update-stage1-progress.yml'

permissions:
  contents: write

jobs:
  update-experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update docs/experiment_plan.md
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, textwrap
          p = Path('docs/experiment_plan.md')
          s = p.read_text()
          if '**版**: v2.6' not in s:
              raise SystemExit('unexpected version')
          s = s.replace('**版**: v2.6', '**版**: v2.7', 1)
          anchor = '**v2.6での変更点（OpenAI Sync backend自己レビューによる内部妥当性hardening）**：'
          note = '''**v2.7での変更点（Pre-Stage 1 P5.5完了・現在地同期）**：
          - `docs/stage1_plan.md`の実装順序にP5.5を正式追加し、condition dispatcher接続、GenerationLog配線、OpenAI PR executor、PR/AR reread parity、evidence-exhaustion signal、RepositoryAccessor clamp契約、Luna live smoke、F11記録までを完了済みphaseとして固定
          - Pre-Stage 1のP0〜P5.5を完了済み（✅）として明記し、次の実装対象をP6 Recalibrationへ更新
          - 現在地を「Stage 1着手前」一般ではなく、**P6着手直前**へ更新。P6では `T_primary / T_challenge`、`B_expose`、`B_work`、PR/AR共通`E_max`等を再較正・freezeする
          - F11の解釈をC2のshared resource contractに合わせ、PR/ARは同一`B_work`・同一`E_max`・同一FIFO-v1を共有し、自律探索に伴う追加resource消費をretrieval-policy effectの一部として扱う方針を維持

          '''
          note = textwrap.dedent(note)
          if anchor not in s:
              raise SystemExit('missing changelog anchor')
          s = s.replace(anchor, note + anchor, 1)
          current = '''**v2.7時点の現在地（2026-09-19）**：Stage 0 / 0.5は完了済み。Pre-Stage 1は **P0〜P5.5まで完了**しており、5条件（MOI / AF / EL / PR / AR）の二軸設計、OpenAI backend / Batch経路、MOI observable interaction、balanced measurement、bounded working-set runtime、RepositoryAccessor、PR/AR retrieval runtime、GenerationLog、reread parity、error/evidence-exhaustion semantics、Luna live smokeまで実装・検証済みである。**次の実装対象はPre-Stage 1 P6：Recalibration**であり、旧3条件版のStage 1 Phase 0へ戻らない。

          **次の実行順序**：

          1. **P6 Recalibration**：Luna capability-floor / AF baselineを再取得し、`T_primary / T_challenge`、`B_expose`、`B_work`、PR/AR共通`E_max`、MOI schema/size、equivalence margin、repeat数をmain comparison前にfreezeする
          2. **Stage 1A**：fixed-\(S_0\)でAF / EL / PR / ARを比較し、C1〜C3を診断する
          3. **Stage 1B**：同一predecessor fixtureからMOI / AF + sham-historyを比較し、C0 immediate history utilityを診断する
          4. **P6.5**：MOI対応Semantic Element Traceをsource-aware化する
          5. **P7**：longitudinal evaluatorを累積評価対応へ更新する
          6. **Stage 1C**：5条件を10〜15世代通すintegration runを行う
          7. Stage 1C完了後、Stage 2 common-environment evaluation / longitudinal pilotへ進む

          以下の旧来の①〜⑥は研究装置を構築した履歴として保持するが、現在の実行順序の根拠には使わない。現在地の正本は `docs/stage1_plan.md` の21節と本節で同期する。'''
          current = textwrap.dedent(current)
          pat = re.compile(r'\*\*v2\.0時点の現在地\*\*：.*?(?=\n\n\*\*方針\*\*)', re.S)
          s, n = pat.subn(lambda m: current, s, count=1)
          if n != 1:
              raise SystemExit(f'current-state replacement count={n}')
          p.write_text(s)
          PY
      - name: Commit and push experiment plan update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/update-stage1-progress.yml
          git add docs/experiment_plan.md
          git diff --cached --check
          git commit -m 'docs(experiment): sync current position to P6 preflight'
          git push origin HEAD:main
