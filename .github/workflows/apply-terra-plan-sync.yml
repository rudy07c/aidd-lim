name: Apply Terra plan sync

on:
  push:
    paths:
      - '.doc-update/update_primary_model_terra.py'
      - '.github/workflows/apply-terra-plan-sync.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update plans
        run: python .doc-update/update_primary_model_terra.py
      - name: Commit updates and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .doc-update/update_primary_model_terra.py
          git rm .github/workflows/apply-terra-plan-sync.yml
          git add docs/experiment_plan.md docs/stage1_plan.md
          git commit -m "docs: use GPT-5.6 Terra for Stage 1"
          git push
