name: Apply P6 postflight fixes v2

on:
  push:
    paths:
      - '.github/p6_postflight_trigger_v2'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            harness/package-lock.json
            synthetic-world/package-lock.json
      - name: Fix generator escaping
        run: python .github/fix_p6_postflight_generator.py
      - name: Apply patch
        run: python .github/apply_p6_postflight_fixes.py
      - name: Mark improved task-bank revision
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('harness/src/p6/task-bank-eligibility.ts')
          s = p.read_text()
          old = 'export const P6_1_TASK_BANK_VERSION = "p6-1-full-task-bank-v2";'
          new = 'export const P6_1_TASK_BANK_VERSION = "p6-1-full-task-bank-v3-postflight-coverage";'
          if old not in s:
              raise SystemExit('task bank version anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Install harness dependencies
        working-directory: harness
        run: npm ci
      - name: Install synthetic-world dependencies
        working-directory: synthetic-world
        run: npm ci
      - name: Typecheck harness
        working-directory: harness
        run: npm run typecheck
      - name: Verify package version resolution
        working-directory: harness
        run: npm run verify:package-version
      - name: Verify invariant task coverage repair
        working-directory: harness
        run: npm run verify:heldout-invariant-coverage
      - name: Verify P6 failure classification
        working-directory: harness
        run: npm run verify:p6-failure-classification
      - name: Verify P6 full task-bank planning
        working-directory: harness
        run: npm run verify:p6-task-bank-eligibility
      - name: Verify P6 runner hardening
        working-directory: harness
        run: npm run verify:p6-task-bank-eligibility-runner
      - name: Verify synthetic-world tests
        working-directory: synthetic-world
        run: npm test -- --runInBand
      - name: Stage 0 mock-noop full
        working-directory: harness
        run: npm run run -- --config config/stage0-mock.json --smoke
      - name: Stage 0 mock-noop limited
        working-directory: harness
        run: npm run run -- --config config/stage0-mock-limited.json --smoke
      - name: Stage 0 mock-oracle full
        working-directory: harness
        run: npm run run -- --config config/stage0-oracle.json --smoke
      - name: Stage 0 mock-oracle limited
        working-directory: harness
        run: npm run run -- --config config/stage0-oracle-limited.json --smoke
      - name: Commit fixes
        run: |
          git config user.name 'rudy07c'
          git config user.email 'rudy07c@gmail.com'
          git add \
            harness/src/agent-backend/package-version.ts \
            harness/src/agent-backend/openai/shared.ts \
            harness/src/agent-backend/anthropic.ts \
            harness/src/p6/task-bank-eligibility.ts \
            harness/verify-package-version.ts \
            harness/verify-heldout-invariant-coverage.ts \
            harness/package.json \
            synthetic-world/heldout_tasks.json \
            docs/stage1_plan.md \
            docs/findings/stage1_findings.md
          git diff --cached --check
          git commit -m 'fix(p6): record postflight and harden task coverage'
          git push
