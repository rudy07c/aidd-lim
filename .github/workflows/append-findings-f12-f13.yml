name: Append findings F12 F13

on:
  push:
    paths:
      - '.github/workflows/append-findings-f12-f13.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append findings
        run: python3 .github/append-findings-f12-f13.py
      - name: Commit findings
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/findings/stage0_5_findings.md
          git diff --cached --check
          git commit -m 'docs(findings): add P6 leakage and cross-model floor findings'
          git push
