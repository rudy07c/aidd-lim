name: Apply OpenAI backend

on:
  push:
    paths:
      - '.code-update/apply_openai_backend.py'
      - '.github/workflows/apply-openai-backend.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: harness/package-lock.json
      - name: Normalize preflight mock shape for deterministic updater
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('harness/src/agent-backend/mock-oracle.ts')
          text = p.read_text(encoding='utf-8')
          text = text.replace('      latencyMs: Date.now() - start,\n      executionStatus: "ok",\n', '      latencyMs: Date.now() - start,\n')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Apply source updates
        run: python .code-update/apply_openai_backend.py
      - name: Install and pin OpenAI SDK
        working-directory: harness
        run: npm install openai@latest --save
      - name: Typecheck
        working-directory: harness
        run: npm run typecheck
      - name: Offline backend verification
        working-directory: harness
        run: npm run verify:openai
      - name: Commit implementation and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .code-update/apply_openai_backend.py
          git rm .github/workflows/apply-openai-backend.yml
          git add harness
          git status --short
          git commit -m "feat: add GPT-5.6 Luna OpenAI backend"
          git push
