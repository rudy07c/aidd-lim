name: P6 Record PowerTOST Validation

on:
  push:
    branches:
      - fix/p6-2-variance-hardening
    paths:
      - .github/workflows/p6-record-powertost-validation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p6-2-variance-hardening
          fetch-depth: 0

      - name: Record completed external exact-power validation
        shell: python
        run: |
          from pathlib import Path
          import re

          eq = Path("harness/src/p6/equivalence-power.ts")
          text = eq.read_text()
          old = ''' * Validation status (2026-09-21): the seven frozen verifier fixtures were
 * independently recomputed by reproducing OwenQ::ipowen4's x-space integral
 * with SciPy adaptive quadrature; maximum absolute discrepancy was ~1.3e-15.
 * R/PowerTOST itself was not executable in the available environment, so an
 * executed PowerTOST cross-check remains pending before scientific repeat-n
 * is frozen. See docs/stage1_plan.md.
'''
          new = ''' * Validation status (2026-09-21): the production integral was first checked
 * independently against OwenQ::ipowen4's x-space integral. It was then
 * cross-checked in GitHub Actions with R 4.6.1 / PowerTOST 1.5.7 over all 13
 * frozen fixtures using the public paired API, method="exact". Maximum absolute
 * discrepancy versus the fixtures was 7.17e-13; public API versus PowerTOST's
 * internal Owen-Q kernel differed by at most 3.33e-16. The independent
 * method="mvt" path agreed within 7.37e-06 (its expected looser numerical
 * tolerance). External-software validation is therefore complete. Scientific
 * repeat-n remains null until the AF-vs-AF variance pilot supplies sigma_U; it
 * is no longer blocked by exact-power validation. See docs/stage1_plan.md.
'''
          if old not in text:
              raise SystemExit("equivalence-power validation paragraph not found")
          eq.write_text(text.replace(old, new))

          verifier = Path("harness/verify-p6-variance-hardening.ts")
          v = verifier.read_text()
          oldv = '''// This is a source-equivalent independent numerical check, NOT evidence that
// R/PowerTOST itself was executed; that external-software cross-check remains
// a precondition for freezing the scientific repeat count.
'''
          newv = '''// These source-equivalent fixtures were subsequently executed against
// R 4.6.1 / PowerTOST 1.5.7 (public paired method="exact") in workflow run
// 35565684947; max fixture discrepancy was 7.17e-13. The fixture set is now
// externally validated as well as independently derived.
'''
          if oldv not in v:
              raise SystemExit("verifier provenance paragraph not found")
          verifier.write_text(v.replace(oldv, newv))

          plan = Path("docs/stage1_plan.md")
          p = plan.read_text()
          pattern = re.compile(r'- \*\*exact power外部照合status（2026-09-21）\*\*：.*?\n- Stage 1 primary comparison', re.S)
          replacement = '''- **exact power外部照合status（2026-09-21）**：`exactPairedTostPowerAtZero()`の数式は、Owen (1965) equality (11) の第4累積関数 `O_4`、CRAN `OwenQ::ipowen4` の独立Gauss–Kronrod積分、およびPhillips型bivariate noncentral-t定式化へ代数的に写像できることを再導出した。さらにGitHub Actions run `35565684947` で **R 4.6.1 / PowerTOST 1.5.7** を実際に導入し、13個のfrozen `(n, sigma/Delta)` fixtureすべてについて `power.TOST(logscale=FALSE, design="paired", method="exact")` を実行した。PowerTOSTのpaired designでは `sem = CV*sqrt(2/n)` なので、paired-difference SD `sigma` に対して `CV=sigma/sqrt(2)` として `sem=sigma/sqrt(n)` を一致させた。fixtureと公開API `method="exact"` の最大絶対差は `7.17e-13`、公開APIとPowerTOST内部Owen-Q kernel `PowerTOST:::.power.TOST` の最大差は `3.33e-16` だった。独立な `method="mvt"` 経路も最大 `7.37e-06` で一致し、同経路の既定数値積分toleranceと整合する。したがってexact power実装についての**外部統計ソフトウェア照合ゲートは完了**とする。`P6_2_FROZEN_SCIENTIFIC_REPEAT_COUNT` が `null` のままである理由は、今後AF-vs-AF variance pilotから `sigma_U` / `sigma_plan` を得てrequired nを計算する必要があるためであり、exact power未検証のためではない
- Stage 1 primary comparison'''
          p2, n = pattern.subn(replacement, p, count=1)
          if n != 1:
              raise SystemExit(f"stage1 exact-power status replacement count={n}")
          plan.write_text(p2)

          # Remove temporary validation workflows after preserving the result in source/docs.
          for rel in [
              ".github/workflows/p6-exact-powertost-crosscheck.yml",
              ".github/workflows/p6-record-powertost-validation.yml",
          ]:
              path = Path(rel)
              if path.exists():
                  path.unlink()

      - name: Commit recorded validation and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: record successful PowerTOST exact-power validation"
          git push origin HEAD:fix/p6-2-variance-hardening
