name: P6-3 v3 Result Finalizer

on:
  push:
    paths:
      - 'harness/src/p6/p6-3-v3-result-finalizer.ts'
      - 'harness/src/p6/p6-3-v3-live-controller.ts'
      - 'harness/src/p6/p6-3-v3-calibration-runner.ts'
      - 'harness/src/p6/p6-3-v3-calibration-predeclaration.ts'
      - 'harness/p6-3-v3-finalize.ts'
      - 'harness/verify-p6-3-v3-result-finalizer.ts'
      - 'harness/package.json'
      - 'harness/package-lock.json'
      - '.github/workflows/p6-3-v3-result-finalizer-ci.yml'
  pull_request:
    paths:
      - 'harness/src/p6/p6-3-v3-result-finalizer.ts'
      - 'harness/src/p6/p6-3-v3-live-controller.ts'
      - 'harness/src/p6/p6-3-v3-calibration-runner.ts'
      - 'harness/src/p6/p6-3-v3-calibration-predeclaration.ts'
      - 'harness/p6-3-v3-finalize.ts'
      - 'harness/verify-p6-3-v3-result-finalizer.ts'
      - 'harness/package.json'
      - 'harness/package-lock.json'
      - '.github/workflows/p6-3-v3-result-finalizer-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and verify v3 result finalizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: harness/package-lock.json
      - name: Install harness dependencies
        working-directory: harness
        run: npm ci
      - name: Typecheck harness
        working-directory: harness
        run: npm run typecheck
      - name: Verify P6-3 v3 result finalizer
        working-directory: harness
        run: npx ts-node verify-p6-3-v3-result-finalizer.ts
