name: One-shot P6 probe ID leak final

on:
  push:
    paths:
      - '.github/workflows/p6-probe-id-leak-final.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            harness/package-lock.json
            calibration/package-lock.json
            synthetic-world/package-lock.json
      - name: Install dependencies
        run: |
          cd calibration && npm ci
          cd ../harness && npm ci
          cd ../synthetic-world && npm ci
      - name: Patch generator, runner, and verification
        shell: python
        run: |
          from pathlib import Path

          def replace_between(text, start_marker, end_marker, replacement):
              a = text.index(start_marker)
              b = text.index(end_marker, a)
              return text[:a] + replacement + text[b:]

          # ---- Stage 1 probe generator ----
          p = Path('calibration/src/stage1-probes.ts')
          s = p.read_text()
          if 'booleanIdCueWarnings: string[];' not in s:
              s = s.replace(
                  '  booleanCueWarnings: string[];\n  duplicateBooleanPrompts: string[];',
                  '  booleanCueWarnings: string[];\n  booleanIdCueWarnings: string[];\n  duplicateBooleanPrompts: string[];'
              )

          ordering = '''  // Do not preserve positive/negative pair adjacency. A stable hash gives reproducible ordering.
          // Temporary construction IDs contain provenance for generator-side bookkeeping only.
          // Re-ID after ordering so no label/provenance cue reaches the model-visible prompt.
          const ordered = [...positives, ...negatives].sort((a, b) => {
            const key = (probe: GeneratedProbe) => crypto
              .createHash("sha256")
              .update(`${STAGE1_BOOLEAN_DESIGN_VERSION}:${probe.probeId}`)
              .digest("hex");
            return key(a).localeCompare(key(b));
          });
          return ordered.map((probe, index) => ({
            ...probe,
            probeId: `${scheme.schemeId}-bool-r${String(index + 1).padStart(2, "0")}`,
          }));'''
          s = replace_between(s, '  // Do not preserve positive/negative pair adjacency.', '\n}\n\n/**\n * Build the Stage 1 bank', ordering)
          s = s.replace(
              '.filter((p) => /\\b(?:E|O|I)\\d+\\b/.test(p.prompt))',
              '.filter((p) => /\\b(?:E|O|I)\\d+\\b/.test(`${p.probeId}\\n${p.prompt}`))'
          )
          cue_line = '  const booleanCueWarnings = booleanProbes.filter((p) => cuePattern.test(p.prompt)).map((p) => p.probeId);\n'
          if 'const booleanIdCueWarnings' not in s:
              s = s.replace(
                  cue_line,
                  cue_line +
                  '  const idCuePattern = /positive|negative|matched|true|false|(?:^|-)I\\d+(?:-|$)/i;\n' +
                  '  const booleanIdCueWarnings = booleanProbes.filter((p) => idCuePattern.test(p.probeId)).map((p) => p.probeId);\n'
              )
          if '    booleanIdCueWarnings,\n' not in s:
              s = s.replace('    booleanCueWarnings,\n    duplicateBooleanPrompts,', '    booleanCueWarnings,\n    booleanIdCueWarnings,\n    duplicateBooleanPrompts,')
          if 'audit.booleanIdCueWarnings.length > 0' not in s:
              s = s.replace(
                  '  if (audit.duplicateBooleanPrompts.length > 0) {',
                  '  if (audit.booleanIdCueWarnings.length > 0) {\n' +
                  '    throw new Error(`Stage 1 boolean probe IDs contain answer/provenance cues: ${audit.booleanIdCueWarnings.join(", ")}`);\n' +
                  '  }\n' +
                  '  if (audit.duplicateBooleanPrompts.length > 0) {'
              )
          p.write_text(s)

          # ---- P6 live runner ----
          p = Path('harness/p6-preflight-live.ts')
          s = p.read_text()
          batch_group = '''  // Keep boolean primary probes isolated from mc/stp reference probes.
          // F9 reference questions must not provide same-call hints to the primary R^sem measurement.
          const probeGroups = [
            probes.filter((p) => p.type === "boolean"),
            probes.filter((p) => p.type !== "boolean"),
          ].filter((group) => group.length > 0);
          for (const group of probeGroups) {
            for (let i = 0; i < group.length; i += PROBE_BATCH_SIZE) {
              const batch = group.slice(i, i + PROBE_BATCH_SIZE);
              const r = await answerProbeBatch(client, ctx.files, batch);
              Object.assign(answers, r.answers);
              actualModels.push(r.model);
              addUsage(usage, r.usage);
              estimatedCostUsd += r.cost;
            }
          }'''
          s = replace_between(s, '  for (let i = 0; i < probes.length; i += PROBE_BATCH_SIZE) {', '\n  const scored = scoreProbes(probes, answers);', batch_group)

          static_block = '''  const staticAudit = {
            total: audit.audit.total,
            designVersion: audit.designVersion,
            booleanTotal: audit.audit.booleanTotal,
            booleanTrue: audit.audit.booleanTrue,
            booleanFalse: audit.audit.booleanFalse,
            counterexampleNegativeCount: audit.audit.counterexampleNegativeCount,
            surfaceNeutralBooleanCount: audit.audit.surfaceNeutralBooleanCount,
            f5Warnings: audit.audit.f5Warnings,
            rawGroundTruthIdLeakage: audit.audit.rawGroundTruthIdLeakage,
            booleanCueWarnings: audit.audit.booleanCueWarnings,
            booleanIdCueWarnings: audit.audit.booleanIdCueWarnings,
          };
          if (
            staticAudit.designVersion !== "stage1-neutral-relation-v2" ||
            staticAudit.booleanTotal !== 12 ||
            staticAudit.booleanTrue !== 6 ||
            staticAudit.booleanFalse !== 6 ||
            staticAudit.counterexampleNegativeCount !== 6 ||
            staticAudit.surfaceNeutralBooleanCount !== 12 ||
            staticAudit.f5Warnings.length ||
            staticAudit.rawGroundTruthIdLeakage.length ||
            staticAudit.booleanCueWarnings.length ||
            staticAudit.booleanIdCueWarnings.length
          ) {
            throw new Error(`P6-0 static probe audit failed: ${JSON.stringify(staticAudit)}`);
          }

          console.log("P6-0 PREDECLARED GATES", JSON.stringify(P6_0_GATES));
          '''
          s = replace_between(s, '  const staticAudit = {', '  console.log("P6-1 PREDECLARED RULE"', static_block)
          p.write_text(s)

          # ---- P3 verification ----
          p = Path('calibration/verify-p3-measurement.ts')
          s = p.read_text()
          if 'audit.booleanIdCueWarnings.length' not in s:
              s = s.replace(
                  '  assert.strictEqual(audit.booleanCueWarnings.length, 0);\n',
                  '  assert.strictEqual(audit.booleanCueWarnings.length, 0);\n  assert.strictEqual(audit.booleanIdCueWarnings.length, 0);\n'
              )
          if '"boolean-id-cue-scan"' not in s:
              s = s.replace('      "boolean-answer-cue-scan",\n', '      "boolean-answer-cue-scan",\n      "boolean-id-cue-scan",\n')
          p.write_text(s)

          # Fail fast before running tooling.
          checks = {
              'generator-neutral-id': ('calibration/src/stage1-probes.ts', 'probeId: `${scheme.schemeId}-bool-r${String(index + 1)'),
              'generator-id-audit': ('calibration/src/stage1-probes.ts', 'booleanIdCueWarnings'),
              'runner-separated-batches': ('harness/p6-preflight-live.ts', 'const probeGroups = ['),
              'runner-id-audit': ('harness/p6-preflight-live.ts', 'staticAudit.booleanIdCueWarnings.length'),
          }
          for name, (file, token) in checks.items():
              if token not in Path(file).read_text():
                  raise SystemExit(f'{name} missing')

      - name: Regenerate and verify
        run: |
          cd calibration
          npm run generate-probes:stage1
          npm run typecheck
          npm run verify:p3
          npx ts-node src/calibration-runner.ts --backend=mock-noop --budgets=0 --tasks=T-local-1 --probe-bank=stage1
          cd ../harness
          npm run typecheck
          cd ../synthetic-world
          npm test -- --runInBand
      - name: Commit final repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/p6-probe-id-leak-fix.yml .github/workflows/p6-probe-id-leak-fix2.yml .github/workflows/p6-probe-id-leak-final.yml
          git add calibration/src/stage1-probes.ts calibration/verify-p3-measurement.ts calibration/fixtures/probe-bank-stage1.json calibration/fixtures/probe-bank-stage1.audit.json harness/p6-preflight-live.ts
          git commit -m 'fix(p6): close probe-label leakage paths'
          git push
