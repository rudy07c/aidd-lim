name: P6-3 Unified Pre-Live Gate

on:
  push:
    paths:
      - 'harness/**'
      - 'calibration/**'
      - 'synthetic-world/**'
      - 'docs/findings/evidence/p6-2-af-baseline/result.json'
      - 'docs/p6_3_unified_prelive_gate.md'
      - 'docs/p6_3_cost_estimate.md'
      - 'docs/p6_3_v2_design_audit.md'
      - 'docs/p6_3_v2_end_to_end_wiring.md'
      - 'docs/p6_3_v2_final_prelive_gate.md'
      - 'docs/p6_3_v2_paid_live_wiring.md'
      - '.github/workflows/p6-3-prelive-gate-ci.yml'
  pull_request:
    paths:
      - 'harness/**'
      - '!harness/p6-3-v3-**'
      - '!harness/verify-p6-3-v3-**'
      - '!harness/src/p6/p6-3-v3-**'
      - '!harness/src/context/p6-3-v3-**'
      - '!harness/src/context/fixed-environment-runtime.ts'
      - '!harness/src/context/generation-zero-fixed-environment.ts'
      - '!harness/src/context/fixed-world-protocol-spec.ts'
      - 'calibration/**'
      - 'synthetic-world/**'
      - 'docs/findings/evidence/p6-2-af-baseline/result.json'
      - 'docs/p6_3_unified_prelive_gate.md'
      - 'docs/p6_3_cost_estimate.md'
      - 'docs/p6_3_v2_design_audit.md'
      - 'docs/p6_3_v2_end_to_end_wiring.md'
      - 'docs/p6_3_v2_final_prelive_gate.md'
      - 'docs/p6_3_v2_paid_live_wiring.md'
      - '.github/workflows/p6-3-prelive-gate-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TS_NODE_TRANSPILE_ONLY: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: harness/package-lock.json
      - name: Install harness dependencies
        working-directory: harness
        run: npm ci
      - name: Typecheck harness
        working-directory: harness
        run: npm run typecheck
      - name: Run legacy unified P6-3 pre-live gate
        working-directory: harness
        env:
          P6_3_PRELIVE_RECEIPT_OUTPUT: ../runs/_smoke/p6-3-unified-prelive-receipt.json
        run: npx ts-node verify-p6-3-unified-prelive-gate.ts
      - name: Run layered P6-3 v2 paid/live gate
        working-directory: harness
        env:
          OPENAI_API_KEY: offline-ci-must-never-use-this
          P6_3_LIVE_EXECUTION_ALLOWED: '1'
          P6_3_V2_FINAL_PRELIVE_RECEIPT_OUTPUT: ../runs/_smoke/p6-3-v2-final-prelive-receipt.json
          P6_3_V2_PAID_LIVE_RECEIPT_OUTPUT: ../runs/_smoke/p6-3-v2-paid-live-wiring-receipt.json
        run: npx ts-node verify-p6-3-v2-paid-live-gate.ts
      - name: Upload legacy unified P6-3 pre-live receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p6-3-unified-prelive-receipt
          path: runs/_smoke/p6-3-unified-prelive-receipt.json
          if-no-files-found: error
      - name: Upload final P6-3 v2 pre-live receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p6-3-v2-final-prelive-receipt
          path: runs/_smoke/p6-3-v2-final-prelive-receipt.json
          if-no-files-found: error
      - name: Upload P6-3 v2 paid/live wiring receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p6-3-v2-paid-live-wiring-receipt
          path: runs/_smoke/p6-3-v2-paid-live-wiring-receipt.json
          if-no-files-found: error
