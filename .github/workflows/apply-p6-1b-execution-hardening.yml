name: Apply P6-1b execution hardening

on:
  push:
    paths:
      - '.github/apply_p6_1b_execution_hardening.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: harness/package-lock.json
      - name: Apply hardening patch
        run: python .github/apply_p6_1b_execution_hardening.py
      - name: Install harness dependencies
        working-directory: harness
        run: npm ci
      - name: Typecheck harness
        working-directory: harness
        run: npm run typecheck
      - name: Verify P6 failure classification
        working-directory: harness
        run: npm run verify:p6-failure-classification
      - name: Verify P6 task-bank planning
        working-directory: harness
        run: npm run verify:p6-task-bank-eligibility
      - name: Verify P6 runner hardening offline
        working-directory: harness
        run: npm run verify:p6-task-bank-eligibility-runner
      - name: Commit hardening changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitignore docs/stage1_plan.md docs/experiment_plan.md harness/package.json harness/p6-task-bank-eligibility-live.ts harness/src/p6/task-bank-live-runtime.ts harness/verify-p6-task-bank-eligibility-runner.ts
          git diff --cached --check
          git commit -m "fix(p6): harden task-bank live execution phases"
          git push
