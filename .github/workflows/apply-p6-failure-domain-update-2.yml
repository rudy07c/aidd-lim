name: Clean P6 plan wording

on:
  push:
    paths:
      - '.github/workflows/apply-p6-failure-domain-update-2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix wording
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/stage1_plan.md')
          s = p.read_text()
          old = 'post-hoc task除外ではな、context condition'
          new = 'post-hoc task除外ではなく、context condition'
          if old not in s:
              raise SystemExit('wording anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit wording fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/stage1_plan.md
          git diff --cached --check
          git commit -m "docs(p6): fix capability-floor wording"
          git push
