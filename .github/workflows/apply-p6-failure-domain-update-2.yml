name: Apply P6 failure-domain patch v2

on:
  push:
    paths:
      - '.github/workflows/apply-p6-failure-domain-update-2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reuse staged patch payload
        shell: bash
        run: |
          payload=$(sed -n "s/^[[:space:]]*run: echo '\([^']*\)' | base64 -d | python3$/\1/p" .github/workflows/apply-p6-failure-domain-update.yml)
          test -n "$payload"
          printf '%s' "$payload" | base64 -d | python3
          git checkout -- .github/workflows/harness-ci.yml
      - name: Commit research update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harness/p6-preflight-live.ts harness/package.json docs/stage1_plan.md
          git diff --cached --check
          git commit -m "fix(p6): separate semantic and protocol failures"
          git push
