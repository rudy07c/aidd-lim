name: Apply Batch independent request guard

on:
  push:
    paths:
      - '.github/workflows/apply-batch-independent-request-guard.yml'
      - 'harness/scripts/apply_batch_independent_guard.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: harness/package-lock.json
      - name: Apply targeted guard
        run: python harness/scripts/apply_batch_independent_guard.py
      - name: Install harness dependencies
        working-directory: harness
        run: npm ci
      - name: Typecheck
        working-directory: harness
        run: npm run typecheck
      - name: Verify Batch guard
        working-directory: harness
        run: npm run verify:openai-batch
      - name: Verify existing OpenAI offline path
        working-directory: harness
        run: npm run verify:openai
      - name: Commit applied change
        run: |
          rm .github/workflows/apply-batch-independent-request-guard.yml
          rm harness/scripts/apply_batch_independent_guard.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harness/src/agent-backend/openai/batch.ts harness/verify-openai-batch.ts .github/workflows/apply-batch-independent-request-guard.yml harness/scripts/apply_batch_independent_guard.py
          git commit -m "fix: enforce independent Batch request envelope"
          git push
