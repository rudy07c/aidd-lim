name: P4 Emax V2 Doc Sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p4-emax-v2-doc-sync.yml'

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refine two-phase retrieval accounting
        run: >-
          python -c 'from pathlib import Path; p=Path("docs/stage1_plan.md"); t=p.read_text(); old="`E_{max}` のconsumeはfail-closed / atomicとする。model call・decision roundは外部操作の前にconsumeする。repository retrievalはtrusted accessorが候補結果を内部生成してもよいが、workerへ結果を露出する前にretrieval operationとcanonical retrieved tokensのbudget checkを通す。"; new="`E_{max}` のconsumeはfail-closedにする。model call・decision roundは外部操作の前にconsumeする。repository retrievalは**二段階会計**とし、(1) repository accessを開始する前にretrieval operationを1回consumeし、(2) trusted accessorが候補結果を得た後、workerへ露出する前にcanonical model-visible evidence tokensをconsumeする。空結果・取得失敗でも(1)は返金せず、(2)を0 tokenでcloseする。候補結果がtoken上限を超えて(2)でrejectされた場合も既消費のretrieval operationは返金せず、その同一候補をremaining budget内へtrimするか0 tokenでdiscardしてpending retrievalをcloseする。これによりoversized retrievalをfree retryとして反復できない。"; assert old in t, "Step 6 accounting paragraph not found"; p.write_text(t.replace(old,new,1))'
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/p4-emax-v2-doc-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/stage1_plan.md .github/workflows/p4-emax-v2-doc-sync.yml
          git commit -m 'docs: clarify two-phase E_max retrieval accounting'
          git push
