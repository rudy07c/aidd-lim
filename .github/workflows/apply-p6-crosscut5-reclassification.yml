name: Apply P6-2 crosscut-5 reclassification

on:
  push:
    branches:
      - fix/p6-2-crosscut5-reclassification
    paths:
      - .github/workflows/apply-p6-crosscut5-reclassification.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p6-2-crosscut5-reclassification
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: harness/package-lock.json
      - name: Install harness dependencies
        working-directory: harness
        run: npm ci
      - name: Apply amendment patch
        run: python3 .github/scripts/apply_p6_crosscut5_reclassification.py
      - name: Align variance verifier version literals
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('harness/verify-p6-variance-hardening.ts')
          s = p.read_text()
          s = s.replace('pilotVersion: "p6-2-af-variance-pilot-v2-exact-floor-audit"', 'pilotVersion: "p6-2-af-variance-pilot-v3-taskbank-reanalysis"')
          s = s.replace('sigmaFloorVersion: "p6-2-sigma-floor-v1"', 'sigmaFloorVersion: "p6-2-sigma-floor-v2-primary-bank-unit"')
          p.write_text(s)
          PY
      - name: Typecheck
        working-directory: harness
        run: npm run typecheck
      - name: Verify P6-2 AF baseline
        working-directory: harness
        run: npm run verify:p6-af-baseline
      - name: Verify P6-2 variance pilot
        working-directory: harness
        run: npm run verify:p6-variance-pilot
      - name: Verify P6-1b eligibility regression
        working-directory: harness
        run: npm run verify:p6-task-bank-eligibility
      - name: Verify heldout invariant coverage
        working-directory: harness
        run: npm run verify:heldout-invariant-coverage
      - name: Reanalyze committed historical variance result
        working-directory: harness
        run: |
          npm run p6:reanalyze-af-variance -- ../docs/findings/evidence/p6-2-variance-pilot/result.json > /tmp/p6-reanalysis.json
          node - <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('/tmp/p6-reanalysis.json','utf8');
          const start = text.indexOf('{');
          const x = JSON.parse(text.slice(start));
          if (x.currentPrimaryTaskIds.length !== 11) throw new Error('expected 11 primary tasks');
          if (x.crosscut5Observed.observations !== 16 || x.crosscut5Observed.successes !== 4 || x.crosscut5Observed.semanticFailures !== 11 || x.crosscut5Observed.protocolFailures !== 1) throw new Error('unexpected T-crosscut-5 audit counts');
          if (x.m.requiredN !== 21) throw new Error(`expected M requiredN=21, got ${x.m.requiredN}`);
          if (x.rsem.requiredN !== 11) throw new Error(`expected Rsem requiredN=11, got ${x.rsem.requiredN}`);
          if (x.suggestedCommonRepeatCount !== 21) throw new Error(`expected common candidate=21, got ${x.suggestedCommonRepeatCount}`);
          if (Math.abs(x.m.sampleSd - 0.07586572367238911) > 1e-12) throw new Error('unexpected M sample SD');
          console.log('historical 11-task reanalysis verified');
          NODE
      - name: Commit applied changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harness docs
          git commit -m "fix(p6): reclassify T-crosscut-5 from post-pilot evidence"
          git push origin HEAD:fix/p6-2-crosscut5-reclassification
