name: One-shot P6 plan sync b64

on:
  push:
    paths:
      - '.github/workflows/p6-plan-sync-b64.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rewrite P6-0 section
        env:
          P6_SECTION_B64: ""
        run: |
          python -c 'import os,base64; from pathlib import Path; p=Path("docs/stage1_plan.md"); s=p.read_text(); a=s.index("### 10.0 P6-0：Probe bank再検証（F5/F9・Luna）"); b=s.index("### 10.1 P6-1：Primary task eligibility",a); sec=base64.b64decode(os.environ["P6_SECTION_B64"]).decode(); p.write_text(s[:a]+sec+s[b:])'
      - name: Commit and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/p6-plan-sync-b64.yml
          git add docs/stage1_plan.md
          git commit -m 'docs(p6): record first Luna probe failure and revised gate'
          git push
