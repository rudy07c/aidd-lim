name: Apply doc refinements

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply staged document patches
        shell: bash
        run: |
          set -euo pipefail

          base64 -d .doc-update/paper.patch.gz.b64 | gzip -d > /tmp/paper.patch
          sed -i '1c--- a/docs/aidd_ilm_paper.md' /tmp/paper.patch
          sed -i '2c+++ b/docs/aidd_ilm_paper.md' /tmp/paper.patch

          base64 -d .doc-update/experiment.patch.gz.b64 | gzip -d > /tmp/experiment.patch
          sed -i '1c--- a/docs/experiment_plan.md' /tmp/experiment.patch
          sed -i '2c+++ b/docs/experiment_plan.md' /tmp/experiment.patch

          base64 -d .doc-update/stage1.patch.gz.b64 | gzip -d > /tmp/stage1.patch
          sed -i '1c--- a/docs/stage1_plan.md' /tmp/stage1.patch
          sed -i '2c+++ b/docs/stage1_plan.md' /tmp/stage1.patch

          for n in paper experiment stage1; do
            git apply --check "/tmp/${n}.patch"
            git apply "/tmp/${n}.patch"
          done

          rm -rf .doc-update
          rm -f .github/workflows/apply-doc-refinements.yml

          git config user.name "AIDD-ILM Research"
          git config user.email "researcher@example.com"
          git add -A
          git commit -m "docs: refine theory and Stage 1 design"
          git push origin HEAD:main
