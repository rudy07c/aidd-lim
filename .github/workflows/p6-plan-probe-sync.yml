name: One-shot P6 probe plan sync

on:
  push:
    paths:
      - '.github/workflows/p6-plan-probe-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync P6-0 plan to Luna first-run finding
        shell: python
        run: |
          from pathlib import Path
          p = Path('docs/stage1_plan.md')
          s = p.read_text()
          start = s.index('### 10.0 P6-0：Probe bank再検証（F5/F9・Luna）')
          end = s.index('### 10.1 P6-1：Primary task eligibility', start)
          section = '''### 10.0 P6-0：Probe bank再検証（F5/F9・Luna）

Primary modelをGPT-5.6 Lunaへ移行し、Synthetic World / probe bankもStage 1向けに拡張されたため、task eligibility判定へ入る前に`calibration/fixtures/probe-bank-stage1.json`自体の測定妥当性をlive APIで再確認する。

#### 10.0.1 first Luna preflightで判明したmeasurement failure

2026-09-19のfirst live preflightでは、旧Stage 1 boolean bank（24問）がB=0で3/3 repeatすべて24/24となり、Fullとの差が消失した。一方mc/stp referenceはB=0平均0.22に対し、B=1K=1.00、`protocol_adapter.ts` only≈0.98であり、F9型のoperationTable / naming-pattern inferenceもLunaで再現した。

調査により、旧boolean bankには少なくとも二つの非artifact正答経路があった。

1. true/falseで設問表面形式が異なり、`確認せず` / `場合に限って`等のwordingからlabelを推測できた
2. probe IDに`positive` / `negative` / `matched-negative`等のlabel/provenance cueが含まれ、ID自体がmodel-visibleだった

したがってfirst runはLuna capabilityやcontext sensitivityの結果として解釈せず、**measurement invalid**として扱う。P6-1は開始しない。

#### 10.0.2 revised Stage 1 boolean bank

boolean primaryは`stage1-neutral-relation-v2`へ置換する。

- true側：ground truth上の6つの実在invariant relation
- false側：reachable state graphに実在counterexampleを持つ6つのfalse relation
- true/falseとも完全に同じ表面templateを使う
- model-visible probe IDは`bool-r01`等のopaque IDとし、true/false、invariant ID、matched pair情報を含めない
- generator-side provenanceは`derivedFrom`へ保存するがmodel promptへは出さない
- mc/stpはreference-onlyのまま保持する

static auditは少なくとも以下を要求する。

- boolean primary = 12問（true 6 / false 6）
- false 6問すべてにreachable counterexampleがある
- constant true / false baseline = 0.50
- `f5Warnings=[]`
- prompt / model-visible IDにraw Ground Truth ID leakageなし
- promptにanswer-cue wordingなし
- IDに`positive` / `negative` / `matched` / true/false / invariant ID cueなし
- duplicate boolean promptなし

boolean primaryとmc/stp referenceは**別model call**に分ける。同一API response内でF9 referenceからprimaryへのstructural hintが流れる経路を作らない。

#### 10.0.3 revised live gates

事前に固定するengineering gate：

- Luna × B=0を3 repeatし、boolean平均accuracyが0.35〜0.65
- Luna × Fullを3 repeatし、boolean平均accuracy >= 0.85
- Full−B=0 >= 0.25
- `protocol_adapter.ts` onlyのboolean平均accuracyが0.35〜0.65

`protocol_adapter.ts`はoperation/entity mappingを含むためmc/stp referenceが高得点になること自体はF9 diagnosticとして予想される。しかし、invariant relationを直接表現しないadapterだけでboolean primaryまでchanceを大きく超える場合、primaryにも構造的類推経路が残っているとみなしP6-0 failureとする。

visible-tests-only ablationは引き続き記録するが、**hard gateにはしない**。visible testsは継承artifactそのものであり、preconditionやbehaviorを正当に表現しうるため、testsだけで高いsemantic accuracyが出ることと「答え漏れ」は同義ではない。F5についてはstatic direct-leakage audit、B=0 chance gate、個別probe responseの確認を組み合わせて診断する。

mc/stp referenceについてはB=0 / B=1K / adapter-onlyを記録し、F9再現それ自体はP6-0 failureとはしない。reference結果をprimary `R^sem`へ合算しない。

**Gate P6-0**

- revised static leakage auditがclean
- boolean B=0がchance近傍
- boolean B=0→Fullに十分なdose-responseがある
- adapter-only booleanがchance近傍で、primaryにF9型structural inferenceが混入していない
- F5 tests-only / F9 mc-stpをdiagnosticとして個別記録できる
- 各repeatのprobe-level answer / correct answer / parse error / model / usage / costが保存される

P6-0がfailした場合はprobe bank / measurement pathを修正し、**P6-1を開始しない**。

'''
          p.write_text(s[:start] + section + s[end:])
      - name: Commit plan sync
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/p6-plan-probe-sync.yml
          git add docs/stage1_plan.md
          git commit -m 'docs(p6): record Luna probe-bank measurement failure'
          git push
