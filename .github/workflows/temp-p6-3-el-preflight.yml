name: Temp P6-3 EL structural preflight

on:
  push:
    branches: [feat/p6-3-el-static-runtime]
    paths:
      - '.github/workflows/temp-p6-3-el-preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p6-3-el-static-runtime
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: harness/package-lock.json
      - name: Install harness dependencies
        working-directory: harness
        run: npm ci
      - name: Typecheck harness
        working-directory: harness
        run: npm run typecheck
      - name: Run P6-3 EL structural preflight
        working-directory: harness
        run: npm run p6:el-structural-preflight
