name: P6 Restore Lanczos Coefficient
on:
  push:
    branches:
      - fix/p6-2-variance-hardening
    paths:
      - '.github/workflows/p6-restore-lanczos.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p6-2-variance-hardening
      - name: Restore unchanged Lanczos constant
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('harness/src/p6/equivalence-power.ts')
          s=p.read_text()
          old='1.5056327353116e-7'
          new='1.5056327351493116e-7'
          if s.count(old) != 1:
              raise SystemExit('unexpected Lanczos coefficient state')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit restore and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add harness/src/p6/equivalence-power.ts
          git rm .github/workflows/p6-restore-lanczos.yml
          git commit -m 'fix: restore unchanged Lanczos coefficient'
          git push origin HEAD:fix/p6-2-variance-hardening
