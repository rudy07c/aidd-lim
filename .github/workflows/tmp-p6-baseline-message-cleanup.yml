name: Temporary P6 baseline message cleanup

on:
  push:
    branches:
      - fix/p6-2-crosscut5-reclassification
    paths:
      - '.github/workflows/tmp-p6-baseline-message-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p6-2-crosscut5-reclassification
          fetch-depth: 0
      - name: Replace stale frozen-repeat messages
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('harness/p6-af-baseline-live.ts')
          s = p.read_text()
          old1 = 'P6-2 requires explicit --repeats=N; no scientific repeat count is frozen yet'
          new1 = 'P6-2 requires explicit --repeats=N; the supplied value must match the frozen scientific repeat count'
          old2 = 'STOP: dry/offline mode. Delta_M/Delta_R are frozen; live remains blocked until the variance pilot freezes scientific repeat count.'
          new2 = 'STOP: dry/offline mode. Delta_M/Delta_R and the scientific repeat count are frozen; no live execution was requested.'
          assert s.count(old1) == 1, s.count(old1)
          assert s.count(old2) == 1, s.count(old2)
          s = s.replace(old1, new1).replace(old2, new2)
          p.write_text(s)
          PY
      - name: Commit cleanup and remove temporary workflow
        run: |
          git config user.name 'AIDD-ILM Research'
          git config user.email 'researcher@example.com'
          git rm .github/workflows/tmp-p6-baseline-message-cleanup.yml
          git add harness/p6-af-baseline-live.ts
          git commit -m 'chore(p6): refresh frozen-repeat CLI messages'
          git push origin HEAD:fix/p6-2-crosscut5-reclassification
