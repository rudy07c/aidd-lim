name: Temp P6-3 parity patch

on: [push]

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/docs/p6-2-findings-p6-3-prefreeze' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/p6-2-findings-p6-3-prefreeze
          fetch-depth: 0
      - name: Apply parity patch
        run: python .github/_temp_patch_p6_3_parity.py
      - name: Commit plan and remove temporary helpers
        run: |
          rm .github/_temp_patch_p6_3_parity.py
          rm .github/workflows/temp-p6-3-parity-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: add EL-AF representation parity gate"
          git push origin HEAD:docs/p6-2-findings-p6-3-prefreeze
