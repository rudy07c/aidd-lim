name: Fix P6-2 amendment verifier log
on:
  push:
    branches: [fix/p6-2-crosscut5-reclassification]
    paths: [.github/workflows/fix-p6-amendment-log.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p6-2-crosscut5-reclassification
      - name: Correct M/Rsem delta log
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('harness/verify-p6-af-baseline.ts')
          s = p.read_text()
          old = 'console.log(`  equivalence: Delta_M=Delta_R=${P6_2_DELTA_M.toFixed(6)}, 90% CI / alpha=0.05, target power=0.80`);'
          new = 'console.log(`  equivalence: Delta_M=${P6_2_DELTA_M.toFixed(6)}, Delta_R=${P6_2_DELTA_R.toFixed(6)}, 90% CI / alpha=0.05, target power=0.80`);'
          if s.count(old) != 1:
              raise SystemExit('expected one legacy log line')
          p.write_text(s.replace(old, new))
          PY
          git rm .github/workflows/fix-p6-amendment-log.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harness/verify-p6-af-baseline.ts
          git commit -m "test(p6): report amended M and Rsem margins separately"
          git push origin HEAD:fix/p6-2-crosscut5-reclassification
