name: P6-2 equivalence patch

on:
  push:
    branches:
      - p6-2-equivalence-freeze

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p6-2-equivalence-freeze
          fetch-depth: 0
      - name: Apply equivalence freeze patch
        run: python harness/_tmp_patch_p6_2_equivalence.py
      - name: Commit permanent changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harness/src/p6/af-baseline.ts harness/p6-af-baseline-live.ts harness/verify-p6-af-baseline.ts docs/stage1_plan.md docs/experiment_plan.md
          git diff --cached --exit-code && exit 1 || true
          git commit -m "feat: freeze P6-2 equivalence design"
          git push origin HEAD:p6-2-equivalence-freeze
