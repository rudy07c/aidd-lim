name: P6 Exact Reference Patch
on:
  push:
    branches:
      - fix/p6-2-variance-hardening
    paths:
      - '.github/workflows/p6-exact-reference-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p6-2-variance-hardening
          fetch-depth: 0
      - name: Patch exact-reference status and verifier provenance
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('docs/stage1_plan.md')
          s = p.read_text()
          marker = '- Stage 1 primary comparisonの共通repeat数は `max(8, n_M, n_R)` とする\n'
          block = '''- **exact power外部照合status（2026-09-21）**：`exactPairedTostPowerAtZero()`の数式は、Owen (1965) equality (11) の第4累積関数 `O_4`、およびCRAN `OwenQ::ipowen4` の独立Gauss–Kronrod積分へ代数的に写像できることを再導出した。`ipowen4` の公開C++被積分関数をそのまま別系統でSciPy adaptive quadratureへ移植し、複数の `(n, sigma/Delta)` fixtureで現実装値と最大約 `1.3e-15` の絶対差で一致した。一方、この作業環境ではR/PowerTOST自体を実行できていないため、**PowerTOSTの実行値に対する外部ソフトウェア照合は未完了**とする。したがって現時点のexact power値とそこから得られるrequired nは`source-equivalent independently checked, externally unverified against executed PowerTOST`というstatusであり、最終repeat数をfreezeしてはならない。R/PowerTOST `design="paired", method="exact"`（必要なら`method="mvt"`も併記）または同等に信頼できる独立統計ソフトウェアとの実行値照合が完了するまで、`P6_2_FROZEN_SCIENTIFIC_REPEAT_COUNT`は`null`のまま保持し、variance pilot live後であってもrepeat数の最終確定へ進まない\n'''
          if block not in s:
              if marker not in s:
                  raise SystemExit('stage1 repeat-count marker not found')
              s = s.replace(marker, block + marker, 1)
          p.write_text(s)

          q = Path('harness/verify-p6-variance-hardening.ts')
          t = q.read_text()
          marker2 = 'const REFERENCE_POWER = [\n'
          provenance = '''// Independent exact-power reference provenance (2026-09-21):\n// These fixtures were recomputed independently from the production TS integrator\n// by transcribing CRAN OwenQ::ipowen4's published x-space integrand\n// (Owen O_4 / Owen 1965 equality 11) into Python/SciPy adaptive quadrature.\n// The original seven fixtures matched the independent values to <=1.3e-15.\n// This is a source-equivalent independent numerical check, NOT evidence that\n// R/PowerTOST itself was executed; that external-software cross-check remains\n// a precondition for freezing the scientific repeat count.\n'''
          if provenance not in t:
              if marker2 not in t:
                  raise SystemExit('REFERENCE_POWER marker not found')
              t = t.replace(marker2, provenance + marker2, 1)
          old = '  { n: 8, ratio: 0.8, expected: 0.8724593815330828 },\n] as const;'
          new = '''  { n: 8, ratio: 0.8, expected: 0.8724593815330828 },\n  { n: 12, ratio: 1.05, expected: 0.8506785557630506 },\n  { n: 13, ratio: 1.1, expected: 0.8501920240426855 },\n  { n: 20, ratio: 1.5, expected: 0.7804925226676869 },\n  { n: 30, ratio: 2.0, expected: 0.6965086141640441 },\n  { n: 8, ratio: 1.5, expected: 0.17121212404861366 },\n  { n: 30, ratio: 0.7, expected: 0.9999999978502166 },\n] as const;'''
          if 'ratio: 1.05' not in t:
              if old not in t:
                  raise SystemExit('REFERENCE_POWER tail marker not found')
              t = t.replace(old, new, 1)
          q.write_text(t)
          PY
      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/stage1_plan.md harness/verify-p6-variance-hardening.ts
          git rm .github/workflows/p6-exact-reference-patch.yml
          git commit -m 'docs: mark exact power external cross-check pending'
          git push origin HEAD:fix/p6-2-variance-hardening
