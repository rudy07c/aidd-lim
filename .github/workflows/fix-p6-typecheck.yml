name: Fix P6 typecheck

on:
  push:
    paths:
      - '.github/workflows/fix-p6-typecheck.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply typecheck fix
        run: python3 .github/fix_p6_typecheck.py
      - name: Verify diff
        run: git diff --check
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add harness/p6-task-bank-eligibility-live.ts
          git commit -m 'fix(p6): remove duplicate predeclared rule keys'
          git push
