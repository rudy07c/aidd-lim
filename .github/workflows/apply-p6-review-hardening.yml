name: Apply P6 review hardening

on:
  push:
    branches:
      - fix/p6-2-crosscut5-review-hardening

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'ci: apply P6 review hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p6-2-crosscut5-review-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            harness/package-lock.json
            synthetic-world/package-lock.json
      - name: Apply code and plan hardening
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {n}: {old[:120]!r}")
              p.write_text(s.replace(old, new, 1))

          def sub_once(path, pattern, repl, flags=0):
              p = Path(path)
              s = p.read_text()
              out, n = re.subn(pattern, repl, s, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f"{path}: regex expected one match, got {n}: {pattern[:120]!r}")
              p.write_text(out)

          # --- P6-2 task selection / equivalence constants ---
          replace_once(
              "harness/src/p6/af-baseline.ts",
              'export const P6_2_AF_BASELINE_VERSION = "p6-2-af-baseline-v5-postpilot-task-reclassification";\nexport const P6_2_TASK_BANK_VERSION = P6_1_TASK_BANK_VERSION;\n',
              'export const P6_2_AF_BASELINE_VERSION = "p6-2-af-baseline-v6-task-selection-freeze";\n'
              'export const P6_2_TASK_BANK_VERSION = P6_1_TASK_BANK_VERSION;\n'
              '// Source task-bank version remains the historical P6-1b 20-task bank.\n'
              '// Selection membership is versioned separately so provenance does not imply\n'
              '// that the P6-1b classification itself was rewritten.\n'
              'export const P6_2_TASK_SELECTION_VERSION = "p6-2-task-selection-v2-postpilot-low-headroom-frozen";\n'
              'export const P6_2_TASK_SELECTION_FROZEN_AT = "2026-09-21";\n'
          )
          sub_once(
              "harness/src/p6/af-baseline.ts",
              r'export const P6_2_SEMANTIC_FLOOR_TASK_IDS = \[.*?\] as const;\n',
              '''export const P6_2_SEMANTIC_FLOOR_TASK_IDS = [\n  "T-local-1",\n  "T-crosscut-2",\n  "T-invariant-stress-2",\n  "T-invariant-stress-4",\n  "T-invariant-stress-5",\n  "T-crosscut-6",\n] as const;\n\n// T-crosscut-5 is deliberately not relabeled as historical semantic-floor.\n// It had 4 semantic successes in the 16-observation AF calibration sample and\n// is excluded only by the explicit post-pilot low-headroom amendment.\nexport const P6_2_POST_PILOT_LOW_HEADROOM_TASK_IDS = [\n  "T-crosscut-5",\n] as const;\n\nexport const P6_2_EXCLUDED_TASK_IDS = [\n  ...P6_2_SEMANTIC_FLOOR_TASK_IDS,\n  ...P6_2_POST_PILOT_LOW_HEADROOM_TASK_IDS,\n] as const;\n''',
              flags=re.S,
          )
          replace_once(
              "harness/src/p6/af-baseline.ts",
              'export const P6_2_EQUIVALENCE_DESIGN_VERSION = "p6-2-equivalence-v2-taskbank-amendment";',
              'export const P6_2_EQUIVALENCE_DESIGN_VERSION = "p6-2-equivalence-v3-11-task-selection-freeze";'
          )
          replace_once(
              "harness/src/p6/af-baseline.ts",
              '  excludedSemanticFloorTaskIds: string[];\n}',
              '  excludedSemanticFloorTaskIds: string[];\n  excludedPostPilotLowHeadroomTaskIds: string[];\n}'
          )
          replace_once(
              "harness/src/p6/af-baseline.ts",
              '    ...P6_2_SEMANTIC_FLOOR_TASK_IDS,\n  ];',
              '    ...P6_2_SEMANTIC_FLOOR_TASK_IDS,\n    ...P6_2_POST_PILOT_LOW_HEADROOM_TASK_IDS,\n  ];'
          )
          replace_once(
              "harness/src/p6/af-baseline.ts",
              '  for (const floorTaskId of P6_2_SEMANTIC_FLOOR_TASK_IDS) {\n    if (measuredIds.has(floorTaskId)) throw new Error(`Semantic-floor task leaked into P6-2 measured bank: ${floorTaskId}`);\n  }',
              '  for (const excludedTaskId of P6_2_EXCLUDED_TASK_IDS) {\n    if (measuredIds.has(excludedTaskId)) throw new Error(`Excluded task leaked into P6-2 measured bank: ${excludedTaskId}`);\n  }'
          )
          replace_once(
              "harness/src/p6/af-baseline.ts",
              '    excludedSemanticFloorTaskIds: [...P6_2_SEMANTIC_FLOOR_TASK_IDS],\n  };',
              '    excludedSemanticFloorTaskIds: [...P6_2_SEMANTIC_FLOOR_TASK_IDS],\n    excludedPostPilotLowHeadroomTaskIds: [...P6_2_POST_PILOT_LOW_HEADROOM_TASK_IDS],\n  };'
          )
          replace_once(
              "harness/src/p6/af-baseline.ts",
              '// Remains null until the separate AF-vs-AF variance pilot is completed.',
              '// Remains null until the fresh post-selection 11-task AF-vs-AF variance pilot is completed.'
          )

          # --- variance version: fresh pilot only ---
          replace_once(
              "harness/src/p6/variance-pilot.ts",
              'export const P6_2_VARIANCE_PILOT_VERSION = "p6-2-af-variance-pilot-v3-taskbank-reanalysis";',
              'export const P6_2_VARIANCE_PILOT_VERSION = "p6-2-af-variance-pilot-v4-fresh-after-task-selection-freeze";'
          )

          # --- AF baseline result provenance ---
          replace_once(
              "harness/p6-af-baseline-live.ts",
              '  P6_2_SEMANTIC_FLOOR_TASK_IDS,\n  P6_2_TASK_BANK_VERSION,',
              '  P6_2_SEMANTIC_FLOOR_TASK_IDS,\n  P6_2_POST_PILOT_LOW_HEADROOM_TASK_IDS,\n  P6_2_TASK_BANK_VERSION,\n  P6_2_TASK_SELECTION_VERSION,'
          )
          replace_once(
              "harness/p6-af-baseline-live.ts",
              'export const P6_2_RUN_SCHEMA_VERSION = "p6-2-af-baseline-result-v4-exact-power-adjudication";',
              'export const P6_2_RUN_SCHEMA_VERSION = "p6-2-af-baseline-result-v5-task-selection-freeze";'
          )
          replace_once(
              "harness/p6-af-baseline-live.ts",
              '  taskBankVersion: typeof P6_2_TASK_BANK_VERSION;\n  failureClassificationVersion:',
              '  taskBankVersion: typeof P6_2_TASK_BANK_VERSION;\n  taskSelectionVersion: typeof P6_2_TASK_SELECTION_VERSION;\n  primaryTaskIds: string[];\n  primaryTaskIdsSha256: string;\n  postPilotLowHeadroomTaskIds: string[];\n  failureClassificationVersion:'
          )
          replace_once(
              "harness/p6-af-baseline-live.ts",
              '      excludedSemanticFloorTaskIds: string[];\n      repeatResults:',
              '      excludedSemanticFloorTaskIds: string[];\n      excludedPostPilotLowHeadroomTaskIds: string[];\n      repeatResults:'
          )
          replace_once(
              "harness/p6-af-baseline-live.ts",
              '    taskBankVersion: P6_2_TASK_BANK_VERSION,\n    failureClassificationVersion:',
              '    taskBankVersion: P6_2_TASK_BANK_VERSION,\n    taskSelectionVersion: P6_2_TASK_SELECTION_VERSION,\n    primaryTaskIds: [...P6_2_PRIMARY_TASK_IDS],\n    primaryTaskIdsSha256: hashText(stableJson([...P6_2_PRIMARY_TASK_IDS])),\n    postPilotLowHeadroomTaskIds: [...P6_2_POST_PILOT_LOW_HEADROOM_TASK_IDS],\n    failureClassificationVersion:'
          )
          replace_once(
              "harness/p6-af-baseline-live.ts",
              '        excludedSemanticFloorTaskIds: [...P6_2_SEMANTIC_FLOOR_TASK_IDS],\n        repeatResults:',
              '        excludedSemanticFloorTaskIds: [...P6_2_SEMANTIC_FLOOR_TASK_IDS],\n        excludedPostPilotLowHeadroomTaskIds: [...P6_2_POST_PILOT_LOW_HEADROOM_TASK_IDS],\n        repeatResults:'
          )

          # --- fresh variance pilot provenance ---
          replace_once(
              "harness/p6-af-variance-pilot-live.ts",
              '  P6_2_MAX_SCIENTIFIC_REPEATS, P6_2_MIN_SCIENTIFIC_REPEATS, P6_2_PRIMARY_TASK_IDS,\n  P6_2_TASK_BANK_VERSION,',
              '  P6_2_MAX_SCIENTIFIC_REPEATS, P6_2_MIN_SCIENTIFIC_REPEATS, P6_2_PRIMARY_TASK_IDS,\n  P6_2_POST_PILOT_LOW_HEADROOM_TASK_IDS, P6_2_TASK_BANK_VERSION, P6_2_TASK_SELECTION_VERSION,'
          )
          replace_once(
              "harness/p6-af-variance-pilot-live.ts",
              'export const P6_2_VARIANCE_RESULT_SCHEMA = "p6-2-af-variance-pilot-result-v2-hardening";',
              'export const P6_2_VARIANCE_RESULT_SCHEMA = "p6-2-af-variance-pilot-result-v3-task-selection-freeze";'
          )
          replace_once(
              "harness/p6-af-variance-pilot-live.ts",
              '  pairedAfRepeats: number; maxAttemptsPerPair: number; taskBankVersion: string; taskBankSha256: string; repositorySha256: string;\n  booleanProbeBankSha256:',
              '  pairedAfRepeats: number; maxAttemptsPerPair: number; taskBankVersion: string; taskSelectionVersion: string; taskBankSha256: string; repositorySha256: string;\n  primaryTaskIdsSha256: string; postPilotLowHeadroomTaskIds: string[];\n  booleanProbeBankSha256:'
          )
          replace_once(
              "harness/p6-af-variance-pilot-live.ts",
              '  "harness/p6-af-variance-pilot-live.ts", "harness/p6-af-baseline-live.ts", "harness/src/p6/variance-pilot.ts",\n',
              '  "harness/p6-af-variance-pilot-live.ts", "harness/p6-af-baseline-live.ts", "harness/src/p6/variance-pilot.ts",\n  "harness/src/p6/af-baseline.ts",\n'
          )
          replace_once(
              "harness/p6-af-variance-pilot-live.ts",
              '    maxScientificRepeats: P6_2_MAX_SCIENTIFIC_REPEATS, pairedAfRepeats: P6_2_VARIANCE_PILOT_PAIRED_AF_REPEATS, maxAttemptsPerPair: P6_2_VARIANCE_PILOT_MAX_ATTEMPTS_PER_PAIR,\n    taskBankVersion: P6_2_TASK_BANK_VERSION, taskBankSha256:',
              '    maxScientificRepeats: P6_2_MAX_SCIENTIFIC_REPEATS, pairedAfRepeats: P6_2_VARIANCE_PILOT_PAIRED_AF_REPEATS, maxAttemptsPerPair: P6_2_VARIANCE_PILOT_MAX_ATTEMPTS_PER_PAIR,\n    taskBankVersion: P6_2_TASK_BANK_VERSION, taskSelectionVersion: P6_2_TASK_SELECTION_VERSION, taskBankSha256:'
          )
          replace_once(
              "harness/p6-af-variance-pilot-live.ts",
              '    probeSchemaHash: args.probeSchemaHash, primaryTaskIds: [...P6_2_PRIMARY_TASK_IDS], nodeVersion:',
              '    probeSchemaHash: args.probeSchemaHash, primaryTaskIds: [...P6_2_PRIMARY_TASK_IDS], primaryTaskIdsSha256: hash(stable([...P6_2_PRIMARY_TASK_IDS])),\n    postPilotLowHeadroomTaskIds: [...P6_2_POST_PILOT_LOW_HEADROOM_TASK_IDS], nodeVersion:'
          )

          # --- baseline verifier ---
          replace_once(
              "harness/verify-p6-af-baseline.ts",
              '  assert.equal(P6_2_EQUIVALENCE_DESIGN_VERSION, "p6-2-equivalence-v2-taskbank-amendment");',
              '  assert.equal(P6_2_EQUIVALENCE_DESIGN_VERSION, "p6-2-equivalence-v3-11-task-selection-freeze");'
          )
          replace_once(
              "harness/verify-p6-af-baseline.ts",
              '  // P6-2 post-pilot amendment: 11 primary + 2 eligible diagnostic; 7 semantic-floor excluded.',
              '  // P6-2 task-selection freeze: 11 primary + 2 eligible diagnostic; 6 historical semantic-floor + 1 post-pilot low-headroom excluded.'
          )
          replace_once(
              "harness/verify-p6-af-baseline.ts",
              '  assert.deepEqual(selection.excludedSemanticFloorTaskIds, [...P6_2_SEMANTIC_FLOOR_TASK_IDS]);\n  assert.equal(selection.primary.length, 11);',
              '  assert.deepEqual(selection.excludedSemanticFloorTaskIds, [...P6_2_SEMANTIC_FLOOR_TASK_IDS]);\n  assert.deepEqual(selection.excludedPostPilotLowHeadroomTaskIds, ["T-crosscut-5"]);\n  assert.equal(P6_2_SEMANTIC_FLOOR_TASK_IDS.length, 6);\n  assert.equal(selection.primary.length, 11);'
          )
          replace_once(
              "harness/verify-p6-af-baseline.ts",
              '  assert.equal(result.executionManifest.equivalenceDesignVersion, P6_2_EQUIVALENCE_DESIGN_VERSION);',
              '  assert.equal(result.executionManifest.equivalenceDesignVersion, P6_2_EQUIVALENCE_DESIGN_VERSION);\n  assert.equal(result.executionManifest.taskSelectionVersion, "p6-2-task-selection-v2-postpilot-low-headroom-frozen");\n  assert.deepEqual(result.executionManifest.primaryTaskIds, [...P6_2_PRIMARY_TASK_IDS]);\n  assert.deepEqual(result.executionManifest.postPilotLowHeadroomTaskIds, ["T-crosscut-5"]);'
          )

          # --- variance hardening verifier manifest ---
          replace_once(
              "harness/verify-p6-variance-hardening.ts",
              '  P6_2_DELTA_M, P6_2_PRIMARY_TASK_IDS, P6_2_VARIANCE_PILOT_MAX_ATTEMPTS_PER_PAIR,\n',
              '  P6_2_DELTA_M, P6_2_PRIMARY_TASK_IDS, P6_2_VARIANCE_PILOT_MAX_ATTEMPTS_PER_PAIR,\n  P6_2_TASK_SELECTION_VERSION, P6_2_POST_PILOT_LOW_HEADROOM_TASK_IDS,\n'
          )
          replace_once(
              "harness/verify-p6-variance-hardening.ts",
              '  schemaVersion: "p6-2-af-variance-pilot-result-v2-hardening", pilotVersion: "p6-2-af-variance-pilot-v3-taskbank-reanalysis",',
              '  schemaVersion: "p6-2-af-variance-pilot-result-v3-task-selection-freeze", pilotVersion: "p6-2-af-variance-pilot-v4-fresh-after-task-selection-freeze",'
          )
          replace_once(
              "harness/verify-p6-variance-hardening.ts",
              '  minScientificRepeats: 8, maxScientificRepeats: 30, pairedAfRepeats: 8, maxAttemptsPerPair: 3, taskBankVersion: "mock", taskBankSha256: "mock",\n  repositorySha256: "mock", booleanProbeBankSha256: "mock", probeSchemaHash: "mock", primaryTaskIds: [...P6_2_PRIMARY_TASK_IDS], nodeVersion: process.version,',
              '  minScientificRepeats: 8, maxScientificRepeats: 30, pairedAfRepeats: 8, maxAttemptsPerPair: 3, taskBankVersion: "mock", taskSelectionVersion: P6_2_TASK_SELECTION_VERSION, taskBankSha256: "mock",\n  repositorySha256: "mock", booleanProbeBankSha256: "mock", probeSchemaHash: "mock", primaryTaskIds: [...P6_2_PRIMARY_TASK_IDS], primaryTaskIdsSha256: "mock", postPilotLowHeadroomTaskIds: [...P6_2_POST_PILOT_LOW_HEADROOM_TASK_IDS], nodeVersion: process.version,'
          )

          # --- permanent CI regression for historical reanalysis ---
          replace_once(
              ".github/workflows/harness-ci.yml",
              '      - name: Verify P6-2 variance pilot offline\n        working-directory: harness\n        run: npm run verify:p6-variance-pilot\n',
              '      - name: Verify P6-2 variance pilot offline\n        working-directory: harness\n        run: npm run verify:p6-variance-pilot\n      - name: Verify P6-2 historical variance reanalysis audit\n        working-directory: harness\n        run: npm run verify:p6-af-variance-reanalysis\n'
          )

          # --- Stage 1 plan: replace the prior amendment section wholesale ---
          stage = Path("docs/stage1_plan.md")
          s = stage.read_text()
          new_1025b = r'''#### 10.2.5b 2026-09-21 post-pilot task-selection amendment and freeze

2026-09-20のpre-live designはhistorical designとして保持する。その設計ではprimary M=12 task、`Delta_M=1/12`でAF-vs-AF variance pilotを実行し、raw resultを `docs/findings/evidence/p6-2-variance-pilot/result.json` として**設計変更より先にimmutable evidence化**した。結果はMのn=30 power=`0.6816437585696477`で、predeclared ceiling内ではrequiredN=`null`、`statistical-design-needs-audit`となった。同じexact式をceiling外へ診断的に延長すると最小nは37相当である。

その後のbank-wide auditで、historical primary 12 taskのうち`T-crosscut-5`だけが16 AF observations中4 success / 11 semantic failure / 1 protocol failureとなり、11 semantic failureはすべて同一の `boostTalFen: fails when Osk=nim` signatureへ収束した。他11 taskのsemantic failureは0だった。全taskの機械集計は `docs/findings/evidence/p6-2-variance-pilot/postpilot-task-audit.json` に保存する。

この判定を**P6-1b classification ruleの率への一般化とは扱わない**。P6-1bの実装済みruleはabsolute countであり、`semanticSuccesses >= 2 -> eligible`、`0 success && semanticFailures >= 2 -> semantic-floor`、`1 success && semanticFailures >= 2 -> AF-unstable`である。`T-crosscut-5`はhistorical 3 repeatで2 success / 1 semantic failureなので、その時点の`T_primary-eligible`は正しいhistorical classificationとして保持する。

P6-2以降では、repeat freeze前かつprimary condition contrast観測前に限る新しい**post-pilot low-headroom screen**を別規則として導入する。候補化には次をすべて要求する。

1. AF-only calibration evidenceであること。
2. accepted AF observations >=12、かつsemantic-evaluable observations（success + semantic failure）>=12。
3. semantic success rate `<1/3`。
4. semantic failure >=6。
5. dominant normalized semantic failure signatureがsemantic failuresの`>=2/3`を占め、かつ同一signatureが6件以上。
6. historical primary bank全taskへ同一規則を機械適用し、人間が特定taskだけを選ばない。
7. 元result・全task audit・旧/新classification・selectionによるsizingへの影響をprovenance付きで保存する。

このscreenを12 historical primary task全部へ適用すると該当は`T-crosscut-5`だけである。`T-crosscut-5`は4 semantic successを持つためhistorical `semantic-floor`へは移さず、P6-2+専用の **`post-pilot-low-headroom`** としてprimary Mから除外する。P6-1b historical semantic-floor 6 taskはそのまま維持する。

failure signatureの意味論的根拠はpost-pilotに作られたものではない。`harness/fixtures/oracle-patches/T-crosscut-5.ts`はcommit `3fc9838d034c759c03bce2aaab1735723907543d`（2026-09-06）で既に`Osk(E5)=q2(pex)`をground-truth preconditionとして明示しており、commit `f89b12a631defd883ff0bc14b67133ab3a72279e`（2026-09-07）で保存されたStage 0.5のB1K resultでも `boostTalFen: fails when Osk=nim` が実際にfailしている。したがってOsk依存と同型failureにはvariance-pilot以前の独立証拠がある。ただしGPT-5.6 Luna / AFでのpersistent low-headroom頻度を確定したのは今回のpilotであり、この点はpost-pilot selectionである。

current P6-2 task selectionは11 primary task + 2 eligible diagnostic + historical semantic-floor 6 + post-pilot-low-headroom 1として**ここでfreeze**する。selection versionは `p6-2-task-selection-v2-postpilot-low-headroom-frozen`。fresh variance pilotとscientific repeat freezeが完了するまでtask membershipを再変更しない。以後に見つかるtask問題は現行bankから除外せず、次versionまたはsensitivity analysisへ送る。

current margin ruleは固定bankの最小1 unitを無視しないという原則を維持し、Mは11 taskなので `Delta_M=sigma_floor,M=1/11`、Rsemは12 probeのままなので `Delta_R=sigma_floor,R=1/12` とする。alpha=0.05、target power=0.80、片側95% SD-UCB、true exact paired-TOST power、failure semanticsは変更しない。

historical 8 pairを11-taskへ再集約するとdiagnosticにM requiredN=21、Rsem requiredN=11となるが、**これはformal repeat freezeへ使用しない**。同じ8 pairがtask-selection evidenceとselection後varianceの双方へ使われるためpost-selection optimismを否定できない。formal sizingには、旧16 AF observationsを再利用しないfreshな11-task AF-vs-AF 8 pairを新規取得し、そのfresh dataのみからrequiredNを決める。fresh pilot開始後はtask membershipを一切変更しない。

'''
          s, n = re.subn(r'#### 10\.2\.5b .*?(?=#### 10\.2\.6 )', new_1025b, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f"stage1_plan 10.2.5b replace count={n}")
          s = s.replace('- primary 12 taskについて\\(M\\)のAF baseline分布が保存されている', '- primary 11 taskについて\\(M\\)のAF baseline分布が保存されている')
          s = s.replace('**本節はP6-2 live前のpredeclarationである。runner実装、\\((\\Delta_M,\\Delta_R)\\)の具体値確定、variance pilot、live API実行は別作業単位とし、本節の記述だけでは開始しない。**', '**2026-09-20のpre-live freezeはhistorical designとして保持し、2026-09-21の§10.2.5b amendmentがcurrent P6-2 task selection / margin / fresh-pilot手順をsupersedeする。**')
          s, n = re.subn(
              r'### 11\.1 \\(\\Delta_M,\\Delta_R\\)（freeze済み）.*?(?=### 11\.2 )',
              r'''### 11.1 \\(\\Delta_M,\\Delta_R\\)（historical freeze + current amendment）

2026-09-20 historical 12-task designでは、

\\[
\\Delta_M=\\Delta_R=1/12
\\]

をpre-live freezeしてvariance pilotを実行した。このhistorical design/resultは改変せず保存する。

2026-09-21のtask-selection amendment後に有効なcurrent designは、固定bank上の最小1 unitを無視しない同じoperational ruleを維持し、

\\[
\\Delta_M=1/11,\\qquad \\Delta_R=1/12
\\]

とする。Mの1 taskとR^{sem}の1 probeの実世界上の価値が同一であることは仮定しない。M bank membership変更後の`Delta_M`変更は観測SDへ合わせたmargin tuningではなく、事前定義済み `1/|primary task|` ruleの機械的帰結としてversioned amendmentに記録する。

Equivalenceは \\(\\alpha=0.05\\) のTOSTと整合する90% CIで評価し、paired differenceのCI全体が各measurement固有のmargin内へ入った場合のみ主張する。repeat数はfresh 11-task AF-vs-AF variance pilotから決定し、historical 8 pairのpost-selection再集約値は正式freezeへ使用しない。

''',
              s,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit(f"stage1_plan 11.1 replace count={n}")
          stage.write_text(s)

          # --- experiment plan current/historical wording and exact power wording ---
          exp = Path("docs/experiment_plan.md")
          e = exp.read_text()
          e = e.replace(
              'repeat数は8 pairのfresh AF-vs-AF variance pilot（奇数AB/偶数BA、infrastructure-invalidは同一pair idを最大3 attemptまでreplacement）、SD片側95% upper boundを用い、n=8〜30の中心t分布によるexact paired-TOST powerを順に計算してtarget power 0.80を満たす最小nへfreezeする。',
              'repeat数は8 pairのfresh AF-vs-AF variance pilot（奇数AB/偶数BA、infrastructure-invalidは同一pair idを最大3 attemptまでreplacement）、SD片側95% upper boundを用い、paired normal differenceのsample SDの不確実性をchi分布で積分したtrue exact paired-TOST powerをn=8〜30で順に計算してtarget power 0.80を満たす最小nへfreezeする。'
