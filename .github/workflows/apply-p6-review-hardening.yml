name: Apply P6 review hardening

on:
  push:
    branches:
      - fix/p6-2-crosscut5-review-hardening
    paths:
      - '.github/workflows/apply-p6-review-hardening.yml'
      - 'tmp_apply_p6_review_hardening.py'
      - 'tmp_finish_p6_review_hardening.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p6-2-crosscut5-review-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            harness/package-lock.json
            synthetic-world/package-lock.json
      - name: Apply code patch up to known stage1-plan handoff
        run: |
          set +e
          python tmp_apply_p6_review_hardening.py 2> /tmp/p6-patch.err
          status=$?
          set -e
          cat /tmp/p6-patch.err
          test "$status" -eq 1
          grep -Fq 'stage1_plan 11.1 replace count=0' /tmp/p6-patch.err
      - name: Finish plan and experiment documentation patch
        run: python tmp_finish_p6_review_hardening.py
      - name: Install harness dependencies
        working-directory: harness
        run: npm ci
      - name: Install synthetic-world dependencies
        working-directory: synthetic-world
        run: npm ci
      - name: Typecheck
        working-directory: harness
        run: npm run typecheck
      - name: Verify P6 AF baseline
        working-directory: harness
        run: npm run verify:p6-af-baseline
      - name: Verify P6 variance pilot
        working-directory: harness
        run: npm run verify:p6-variance-pilot
      - name: Verify historical reanalysis audit
        working-directory: harness
        run: npm run verify:p6-af-variance-reanalysis
      - name: Verify P6 task eligibility
        working-directory: harness
        run: npm run verify:p6-task-bank-eligibility
      - name: Verify heldout invariant coverage
        working-directory: harness
        run: npm run verify:heldout-invariant-coverage
      - name: Commit hardening
        run: |
          git config user.name "AIDD-ILM Research"
          git config user.email "researcher@example.com"
          git add harness docs .github/workflows/harness-ci.yml
          git commit -m "fix(p6): harden post-pilot task selection and provenance"
          git push origin HEAD:fix/p6-2-crosscut5-review-hardening
