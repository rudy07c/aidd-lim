name: P4 Reread Policy Doc Sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p4-reread-doc-sync.yml'

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Freeze Step 5 reread semantics in Stage 1 plan
        run: >-
          python -c 'from pathlib import Path; p=Path("docs/stage1_plan.md"); t=p.read_text(); old="- reread / re-admission semanticsはStep 5で別途freezeし、Step 4では以前evictした同一unit IDの再admissionを許可しない\n"; new="- Step 5以降、rereadは**以前admit済みかつ現在inactiveな同一 `ArtifactUnit`** に限って許可する\n- reread成功時はfresh admission sequenceを付与し、FIFO上は最も新しいentryとして再admitする\n- already-active unitのrereadはFIFO ageをrefreshせずrejectする\n- reread evidenceはcumulative retrieved / admission tokensへ再度算入するが、unique observed unit数は増やさない\n- 同一unit IDでpath / line range / content / kind等が変化したevidenceはepisode内aliasingを避けるためrejectする\n- reread自体がcapacity pressureを起こす場合も同じFIFO-v1でevictし、incoming reread + pinned memoryだけで `B_{work}` を超える場合はatomic rejectする\n- reread回数・累積探索量の上限はStep 6の `E_{max}` で別途freezeする\n"; assert old in t, "Step 4 defer bullet not found"; p.write_text(t.replace(old,new,1))'
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/p4-reread-doc-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/stage1_plan.md .github/workflows/p4-reread-doc-sync.yml
          git commit -m 'docs: freeze P4 reread semantics'
          git push
