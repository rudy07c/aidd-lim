name: P6-2 review patch

on:
  push:
    branches:
      - p6-2-review-fixes
    paths:
      - 'harness/_tmp_patch_p6_2_review.py'
      - '.github/workflows/p6-2-review-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p6-2-review-fixes
      - name: Apply P6-2 review fixes
        run: python harness/_tmp_patch_p6_2_review.py
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add harness/p6-af-baseline-live.ts harness/src/p6/af-baseline.ts harness/verify-p6-af-baseline.ts
          git diff --cached --check
          git commit -m 'fix(p6): harden AF baseline recovery and Rsem failures'
          git push origin HEAD:p6-2-review-fixes
