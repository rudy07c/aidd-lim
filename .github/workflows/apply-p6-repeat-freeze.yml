name: Apply P6 repeat freeze

on:
  push:
    branches:
      - fix/p6-2-crosscut5-reclassification
    paths:
      - '.github/workflows/apply-p6-repeat-freeze.yml'
      - 'tmp_apply_p6_repeat_freeze.py'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p6-2-crosscut5-reclassification
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            harness/package-lock.json
            calibration/package-lock.json
            synthetic-world/package-lock.json
      - name: Apply repeat freeze patch
        run: python tmp_apply_p6_repeat_freeze.py
      - name: Install harness dependencies
        working-directory: harness
        run: npm ci
      - name: Install calibration dependencies
        working-directory: calibration
        run: npm ci
      - name: Install synthetic-world dependencies
        working-directory: synthetic-world
        run: npm ci
      - name: Typecheck harness
        working-directory: harness
        run: npm run typecheck
      - name: Verify P6 AF baseline
        working-directory: harness
        run: npm run verify:p6-af-baseline
      - name: Verify P6 variance pilot
        working-directory: harness
        run: npm run verify:p6-variance-pilot
      - name: Verify historical and fresh variance evidence
        working-directory: harness
        run: npm run verify:p6-af-variance-reanalysis
      - name: Verify task eligibility
        working-directory: harness
        run: npm run verify:p6-task-bank-eligibility
      - name: Verify heldout invariant coverage
        working-directory: harness
        run: npm run verify:heldout-invariant-coverage
      - name: Commit repeat freeze
        run: |
          git config user.name "AIDD-ILM Research"
          git config user.email "researcher@example.com"
          git add harness/src/p6/af-baseline.ts harness/verify-p6-af-baseline.ts harness/verify-p6-af-variance-reanalysis.ts docs/stage1_plan.md docs/experiment_plan.md docs/findings/p6_2_variance_repeat_freeze.md
          git commit -m "fix(p6): freeze scientific repeat count at 21"
          git push origin HEAD:fix/p6-2-crosscut5-reclassification
