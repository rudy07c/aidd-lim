name: P6 Hardening Patch
on:
  push:
    branches:
      - fix/p6-2-variance-hardening
    paths:
      - '.github/workflows/p6-hardening-doc-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p6-2-variance-hardening
      - name: Patch stage1 predeclaration and legacy baseline verifier
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('docs/stage1_plan.md')
          s = p.read_text()
          start = '- repeat sizingは正規近似を用いない。M/Rそれぞれについてcandidate \\(n=8,9,\\dots,30\\) を順に評価し、真の差0における**exact paired-TOST power**が0.80以上となる最小nを採用する\n'
          end = '- Stage 1 primary comparisonの共通repeat数は `max(8, n_M, n_R)` とする\n'
          if start not in s or end not in s:
              raise SystemExit('stage1 exact-power markers not found')
          a = s.index(start)
          b = s.index(end, a)
          replacement = '''- repeat sizingは正規近似またはshifted central-t近似を用いない。paired normal differenceのsample SD自体がランダム量であることを明示的に積分した**true exact paired-TOST power**を用いる。\\(df=n-1\\)、\\(R=S/\\sigma\\sim\\chi_{df}/\\sqrt{df}\\)、\\(\\lambda=\\Delta\\sqrt{n}/\\sigma\\)、\\(t_c=t_{1-\\alpha,df}\\) とすると、true difference=0でのconditional acceptance probabilityは \\(0\\le r<\\lambda/t_c\\) に対して \\(2\\Phi(\\lambda-t_cr)-1\\) であり、\n\n\\[\nPower(n)=\\int_0^{\\lambda/t_c}\\left[2\\Phi(\\lambda-t_cr)-1\\right]f_{\\chi_{df}/\\sqrt{df}}(r)\\,dr\n\\]\n\n  を数値積分する。これはOwen's Qで表されるunknown-variance paired-TOST exact powerと同値の量であり、旧 `central-t CDF difference` はexactとは扱わない\n- 離散12-unit bankかつpilot 8 pairという設計では、偶然すべてのpair差が0でもpopulation SD=0とはみなさない。live観測前のplanning assumptionとして、\\(\\sigma_{floor,M}=\\Delta_M=1/12\\)、\\(\\sigma_{floor,R}=\\Delta_R=1/12\\) をfreezeする\n- rawな片側95% SD upper bound \\(\\sigma_U\\) はそのまま保存するが、repeat sizingには \\(\\sigma_{plan}=\\max(\\sigma_U,\\sigma_{floor})\\) を用いる。sigma floorはconfidence boundではなく、8 pairの離散pilotから `SD=0 -> n=8` とdegenerateに確定することを防ぐ事前planning ruleであり、pilot観測後に変更しない\n'''
          s = s[:a] + replacement + s[b:]

          audit_marker = '- 各pairのbank-level差 \\(d_j\\) を作り、そのsample SD \\(s_D\\) を推定する\n'
          audit_insert = '''- variance pilotの`needs-audit`は2種類へ分離する。`execution audit`はMのsystem/other、R^{sem}のprotocol/system等の実行由来failureをartifact-level adjudicationしてresume可能にする。`statistical-design audit`はexact powerがn=30までに0.80へ到達しない場合であり、execution adjudicationでは解除せず設計判断を要求する\n- R^{sem} protocol reliabilityはpair/armごとに `attempted / evaluable / valid / failure` を保存し、protocol-invalid observationをsemantic accuracyへ0点変換しない\n'''
          if audit_marker not in s:
              raise SystemExit('stage1 audit marker not found')
          s = s.replace(audit_marker, audit_insert + audit_marker, 1)

          scope_marker = '- n=30でもtarget power=0.80へ到達しない場合は30へ丸めて実行せず、measurement instability / feasibilityの`needs-audit`として停止する\n'
          scope_insert = '''- このAF-vs-AF variance pilotから決まるrepeat数は、現段階では**AF noiseを基準としたplanning value**であり、EL / PR / ARのvarianceがAFより大きい場合にも同じpowerを保証する値とは主張しない\n- 将来、全primary conditionに対してpower保証を求めるconfirmatory designへ進む場合は、P6-3〜P6-5のcondition差の平均を見ずにvariance-only pre-calibrationを行い、事前規則でcondition-specific \\(\\sigma_U\\) のmaxをfreezeする設計を検討する。これは今回は記述のみで実装しない\n'''
          if scope_marker not in s:
              raise SystemExit('stage1 scope marker not found')
          s = s.replace(scope_marker, scope_insert + scope_marker, 1)
          p.write_text(s)

          q = Path('harness/verify-p6-af-baseline.ts')
          t = q.read_text()
          old = 'assert(Math.abs(sigmaEqualsDeltaPower9 - 0.7129123074) < 1e-6, `unexpected n=9 exact power: ${sigmaEqualsDeltaPower9}`);'
          new = 'assert(Math.abs(sigmaEqualsDeltaPower9 - 0.7246881164476543) < 1e-6, `unexpected n=9 exact power: ${sigmaEqualsDeltaPower9}`);'
          if old not in t:
              raise SystemExit('baseline exact-power fixture marker not found')
          q.write_text(t.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/stage1_plan.md harness/verify-p6-af-baseline.ts
          git commit -m 'docs: freeze P6-2 exact variance hardening decisions'
          git push origin HEAD:fix/p6-2-variance-hardening
