name: Temp refine P6-2 findings

on:
  push:
    branches:
      - docs/p6-2-findings-p6-3-prefreeze

permissions:
  contents: write

jobs:
  refine:
    if: github.actor == 'rudy07c'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/p6-2-findings-p6-3-prefreeze
          fetch-depth: 0
      - name: Rewrite F18 and add F19/F20
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('docs/findings/stage1_findings.md')
          s = p.read_text()
          marker = '## F18: P6-2 AF baseline本取得完了'
          assert s.count(marker) == 1, s.count(marker)
          head = s[:s.index(marker)]
          tail = r'''## F18: P6-2 AF baseline本取得完了 — aggregate high-but-nonsaturated / M semantic observed ceiling / Rsem single-probe residual

**日付**: 2026-09-22  
**Phase**: Pre-Stage 1 P6-2  
**Model**: GPT-5.6 Luna / reasoning=`high` / Artifact-Full  
**Evidence**: `docs/findings/evidence/p6-2-af-baseline/result.json`  
**Completion record**: `docs/findings/p6_2_af_baseline.md`

fresh 11-task variance pilotとM-side independence auditを経てfreezeした`N=21`をそのまま用い、P6-2 AF baseline本取得を完了した。primary Mは11 task × 21 repeat = **231/231がscientifically valid**で、217 pass / 14 protocol failure、`passRate=0.9393939394`。primary側のaudit exclusionは0で、`system/infrastructure/other`は0だった。

ただし、Mの`semantic failure=0/231`を「231件すべてでsemantic correctnessが確認された」とは解釈しない。**231件中semantic-evaluableだった217件は217/217 passであり、残る14件はprotocol failureのためsemantic correctnessが未観測（semantic-censored）**である。したがってAF baselineで言えるのは、**semantic-evaluable subsetの範囲ではobserved semantic-failure channelがceiling（0 observed failures）だった**ということまでである。14件のprotocol failureの機構はF19で分離して記録する。

eligible diagnostic 2 taskは42 repeat中41がscientifically validで36 pass、valid-repeat pass rateは`0.8780487805`。`T-invariant-stress-3` repeat 19でAPI credit exhaustionによるHTTP 429が発生したが、`actualModel=null`かつusage=0のprovider-side実行不能だったため`infrastructure-invalid`として明示adjudicateした。同じrunをresumeして完走し、最終resultのunresolved audit flagは0である。

Rsemは`stage1-neutral-relation-v2`の12 balanced boolean probeを21 repeat実行し、**235/252 = 0.9325396825**。21/21 repeatがprotocol-validで、protocol reliability=`1.0`。aggregateではhigh-but-nonsaturatedだが、残差はprobe bank全体へ均等に散らばっていない。**17件の誤答はすべて`A-obfuscated-bool-r11`へ集中し、r11は4/21 correct、他11 probeはすべて21/21 correct**だった。詳細とlimitationはF20に記録する。

したがってAFは、後続EL / PR / ARを比較するhub baselineとして保存可能である。ただしbaselineの構造は一様ではない。Mではsemantic-evaluable subsetがobserved ceilingで、aggregate Mを1.0から下げた残差はprotocol domainにある。Rsemではaggregateにheadroomが残る一方、その残差は単一probeへ集中している。以後のcondition差では、**Mはsemantic / protocol / system / infrastructureのdomain分解、Rsemはaggregateに加えてprobe-wise accuracyを必ず併記する**。

P6-2のresultを見た後にtask membership、`Delta_M=1/11`、`Delta_R=1/12`、N=21、primary Rsem 12-probe bankを再調整しない。次phaseはP6-3 EL static dose-responseとする。

## F19: P6-2 AF M residual failureはmutation-output protocolへ集中

**日付**: 2026-09-22  
**Phase**: P6-2 AF baseline postflight mechanism audit  
**Evidence**: `docs/findings/evidence/p6-2-af-baseline/result.json`  
**Machine check**: `harness/verify-p6-af-baseline-evidence.ts`

primary 14件 + eligible diagnostic 5件の合計**19件のM protocol failure**をfailureCategory / failureReason単位で再集計した。内訳は次の2機構だけだった。

- **18件**: `output-parse` / `Duplicate modified file path: <path>`
- **1件**: `mutation-validation` / `write-outside-repository-contract:workingNote`

19件のtask / reason内訳は次の通り。

| task | protocol failure reason | count |
|---|---|---:|
| `T-crosscut-1` | `Duplicate modified file path: src/protocol_adapter.ts` | 1 |
| `T-crosscut-3` | `Duplicate modified file path: src/osk/rules.ts` | 1 |
| `T-crosscut-4` | `Duplicate modified file path: src/fen/rules.ts` | 2 |
| `T-delayed-2` | `Duplicate modified file path: src/tal/rules.ts` | 3 |
| `T-invariant-stress-3` | `Duplicate modified file path: src/rush/rules.ts` | 3 |
| `T-invariant-stress-3` | `Duplicate modified file path: src/rushZefFen.ts` | 1 |
| `T-invariant-stress-3` | `Duplicate modified file path: src/zef/rules.ts` | 1 |
| `T-local-2` | `write-outside-repository-contract:workingNote` | 1 |
| `T-local-3` | `Duplicate modified file path: src/fen/rules.ts` | 1 |
| `T-local-4` | `Duplicate modified file path: src/vok/rules.ts` | 3 |
| `T-local-5` | `Duplicate modified file path: src/zef/rules.ts` | 1 |
| `T-local-7` | `Duplicate modified file path: src/vok/rules.ts` | 1 |

18件のduplicate-path failureをpath別に集約すると、`src/protocol_adapter.ts`×1、`src/fen/rules.ts`×3、`src/tal/rules.ts`×3、`src/vok/rules.ts`×4、`src/zef/rules.ts`×2、`src/osk/rules.ts`×1、`src/rush/rules.ts`×3、`src/rushZefFen.ts`×1である。

したがって、**AFのprimary M=`0.9393939394`が1.0にならなかった観測上の主要因はsemantic-domain failureではなく、mutation-output protocolのserialization / duplicate-path handlingである**。ただしこれは「失敗した14 primary attemptがsemanticには正しかった」という主張ではない。protocol failureはsemantic testへ到達しないため、F18のとおりsemantic correctnessは未観測である。

この結果は既存の[`Output Serialization Bottleneck`](./output_serialization_bottleneck.md)と整合する追加証拠である。同findingではfull-file mutation serialization自体が研究対象とは別の人工的selection pressureになり得ることを既に指摘している。今回のduplicate-path集中は、同じmutation-output surfaceが**現在のAF baselineでも実測上のfailure channel**になっていることを示す。したがってP6-3以降のcondition comparisonでは、AF baselineで使ったmutation prompt / schema / parser / validation semanticsを途中で改善してはならない。protocolを変更する場合はAFを含む比較対象全条件を同一versionで再baselineする。

## F20: P6-2 Rsem residual errorはr11へ完全集中し、probe型だけでは説明できない

**日付**: 2026-09-22  
**Phase**: P6-2 AF baseline postflight probe-level audit  
**Evidence**: `docs/findings/evidence/p6-2-af-baseline/result.json`  
**Probe fixture**: `calibration/fixtures/probe-bank-stage1.json`  
**Machine check**: `harness/verify-p6-af-baseline-evidence.ts`

21 repeat × 12 probeの252回答をprobe-wiseに再集計すると、`A-obfuscated-bool-r11`だけが**4/21 correct**で、**残る11 probeはすべて21/21 correct**だった。したがってaggregate `235/252=0.9325396825`の17誤答は全件r11へ集中している。

`probe-bank-stage1.json`上でr11は`correctAnswer=false`、`candidateSource="reachable-counterexample"`、`matchedInvariantId="I1"`として定義されている。しかし同じ`reachable-counterexample`型のfalse probeである`r03`, `r05`, `r08`, `r09`, `r12`はすべて21/21 correctだった。よって、**「reachable counterexampleを見つける型だから難しい」というprobe classだけではr11の低正答率を説明できない**。

r11固有の要因については、P6-3のprimary bankを変更する根拠としてではなく、別途root-cause diagnosticとして調査する。候補として、entity chain / dependency pathの長さ、obfuscation namingとのrelation-specificな相互作用、`matchedInvariantId=I1`周辺の構造、condition/requires pairの非対称性、counterexample stateへの到達経路等を比較する。現段階ではいずれも原因と断定しない。

**r11はprimary Rsem bank（12 probes）から除外しない。** P6-2結果を観測した後にr11を外すとpost-hoc probe selectionになるため、P6-3以降のprimary aggregateは同じ12-probe bankを維持する。r11除外値を示す場合は、P6-2後に定義された**sensitivity analysisのみ**としてprimary resultと明確に分離する。

P6-3以降はaggregate Rsemに加えてprobe-wise accuracyを必須diagnosticとして保存し、特に、(a) r11の挙動が変化するだけなのか、(b) AFで21/21だった他11 probeに新たなerrorが出現するのか、を区別して解釈する。
'''
          p.write_text(head + tail)
          PY

          rm .github/workflows/_temp-refine-p6-findings.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/findings/stage1_findings.md .github/workflows/_temp-refine-p6-findings.yml
          git diff --cached --check
          git commit -m "docs: refine P6-2 findings"
          git push origin HEAD:docs/p6-2-findings-p6-3-prefreeze
