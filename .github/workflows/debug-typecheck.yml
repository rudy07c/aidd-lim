name: Debug Typecheck Capture
on:
  push:
    branches:
      - fix/p6-2-variance-hardening
    paths:
      - 'harness/**/*.ts'
      - '.github/workflows/debug-typecheck.yml'
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p6-2-variance-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: harness/package-lock.json
      - name: Install harness dependencies
        working-directory: harness
        run: npm ci
      - name: Capture typecheck errors
        working-directory: harness
        run: npm run typecheck > ../typecheck-errors.txt 2>&1 || true
      - name: Commit capture
        run: |
          if [ -s typecheck-errors.txt ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add typecheck-errors.txt
            git commit -m 'chore: capture typecheck errors [skip ci]'
            git push origin HEAD:fix/p6-2-variance-hardening
          fi
