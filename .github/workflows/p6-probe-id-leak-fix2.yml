name: One-shot P6 probe ID leak fix v2

on:
  push:
    paths:
      - '.github/workflows/p6-probe-id-leak-fix2.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            harness/package-lock.json
            calibration/package-lock.json
            synthetic-world/package-lock.json
      - name: Install dependencies
        run: |
          cd calibration && npm ci
          cd ../harness && npm ci
          cd ../synthetic-world && npm ci
      - name: Patch Stage 1 probe generator
        shell: python
        run: |
          from pathlib import Path
          p = Path('calibration/src/stage1-probes.ts')
          s = p.read_text()

          def replace_between(text, start_marker, end_marker, replacement):
              a = text.index(start_marker)
              b = text.index(end_marker, a)
              return text[:a] + replacement + text[b:]

          if 'booleanIdCueWarnings: string[];' not in s:
              s = s.replace(
                  '  booleanCueWarnings: string[];\n  duplicateBooleanPrompts: string[];',
                  '  booleanCueWarnings: string[];\n  booleanIdCueWarnings: string[];\n  duplicateBooleanPrompts: string[];'
              )

          ordering = '''  // Do not preserve positive/negative pair adjacency. A stable hash gives reproducible ordering.
          // Temporary construction IDs contain provenance for generator-side bookkeeping only.
          // Re-ID after ordering so no label/provenance cue reaches the model-visible prompt.
          const ordered = [...positives, ...negatives].sort((a, b) => {
            const key = (probe: GeneratedProbe) => crypto
              .createHash("sha256")
              .update(`${STAGE1_BOOLEAN_DESIGN_VERSION}:${probe.probeId}`)
              .digest("hex");
            return key(a).localeCompare(key(b));
          });
          return ordered.map((probe, index) => ({
            ...probe,
            probeId: `${scheme.schemeId}-bool-r${String(index + 1).padStart(2, "0")}`,
          }));'''
          s = replace_between(
              s,
              '  // Do not preserve positive/negative pair adjacency.',
              '\n}\n\n/**\n * Build the Stage 1 bank',
              ordering,
          )

          s = s.replace(
              '.filter((p) => /\\b(?:E|O|I)\\d+\\b/.test(p.prompt))',
              '.filter((p) => /\\b(?:E|O|I)\\d+\\b/.test(`${p.probeId}\\n${p.prompt}`))'
          )

          cue_marker = '  const booleanCueWarnings = booleanProbes.filter((p) => cuePattern.test(p.prompt)).map((p) => p.probeId);\n'
          if 'const booleanIdCueWarnings' not in s:
              if cue_marker not in s:
                  raise SystemExit('boolean cue marker missing')
              s = s.replace(
                  cue_marker,
                  cue_marker +
                  '  const idCuePattern = /positive|negative|matched|true|false|(?:^|-)I\\d+(?:-|$)/i;\n' +
                  '  const booleanIdCueWarnings = booleanProbes.filter((p) => idCuePattern.test(p.probeId)).map((p) => p.probeId);\n'
              )

          if '    booleanIdCueWarnings,\n' not in s:
              s = s.replace(
                  '    booleanCueWarnings,\n    duplicateBooleanPrompts,',
                  '    booleanCueWarnings,\n    booleanIdCueWarnings,\n    duplicateBooleanPrompts,'
              )

          if 'audit.booleanIdCueWarnings.length > 0' not in s:
              marker = '  if (audit.duplicateBooleanPrompts.length > 0) {'
              if marker not in s:
                  raise SystemExit('duplicate prompt assertion marker missing')
              insertion = '''  if (audit.booleanIdCueWarnings.length > 0) {
            throw new Error(`Stage 1 boolean probe IDs contain answer/provenance cues: ${audit.booleanIdCueWarnings.join(", ")}`);
          }
          '''
              s = s.replace(marker, insertion + marker)

          for token in [
              'bool-r${String(index + 1)',
              'booleanIdCueWarnings: string[];',
              '`${p.probeId}\\n${p.prompt}`',
              'audit.booleanIdCueWarnings.length > 0',
          ]:
              if token not in s:
                  raise SystemExit(f'missing generator token {token}')
          p.write_text(s)

      - name: Patch P6 live batching and static audit
        shell: python
        run: |
          from pathlib import Path
          p = Path('harness/p6-preflight-live.ts')
          s = p.read_text()

          def replace_between(text, start_marker, end_marker, replacement):
              a = text.index(start_marker)
              b = text.index(end_marker, a)
              return text[:a] + replacement + text[b:]

          batch_start = '  for (let i = 0; i < probes.length; i += PROBE_BATCH_SIZE) {'
          batch_end = '\n  const scored = scoreProbes(probes, answers);'
          grouped = '''  // Keep boolean primary probes isolated from mc/stp reference probes.
          // Reference probes are intentionally diagnostic (F9) and must not provide same-call hints to R^sem.
          const probeGroups = [
            probes.filter((p) => p.type === "boolean"),
            probes.filter((p) => p.type !== "boolean"),
          ].filter((group) => group.length > 0);
          for (const group of probeGroups) {
            for (let i = 0; i < group.length; i += PROBE_BATCH_SIZE) {
              const batch = group.slice(i, i + PROBE_BATCH_SIZE);
              const r = await answerProbeBatch(client, ctx.files, batch);
              Object.assign(answers, r.answers);
              actualModels.push(r.model);
              addUsage(usage, r.usage);
              estimatedCostUsd += r.cost;
            }
          }'''
          s = replace_between(s, batch_start, batch_end, grouped)

          if 'booleanIdCueWarnings: audit.audit.booleanIdCueWarnings' not in s:
              s = s.replace(
                  '    booleanCueWarnings: audit.audit.booleanCueWarnings,\n',
                  '    booleanCueWarnings: audit.audit.booleanCueWarnings,\n    booleanIdCueWarnings: audit.audit.booleanIdCueWarnings,\n'
              )
          if 'staticAudit.booleanIdCueWarnings.length' not in s:
              s = s.replace(
                  '    staticAudit.booleanCueWarnings.length\n',
                  '    staticAudit.booleanCueWarnings.length ||\n    staticAudit.booleanIdCueWarnings.length\n'
              )

          for token in ['const probeGroups = [', 'booleanIdCueWarnings: audit.audit.booleanIdCueWarnings', 'staticAudit.booleanIdCueWarnings.length']:
              if token not in s:
                  raise SystemExit(f'missing runner token {token}')
          p.write_text(s)

      - name: Patch P3 verification
        shell: python
        run: |
          from pathlib import Path
          p = Path('calibration/verify-p3-measurement.ts')
          s = p.read_text()
          if 'audit.booleanIdCueWarnings.length' not in s:
              marker = '  assert.strictEqual(audit.booleanCueWarnings.length, 0);\n'
              if marker not in s:
                  raise SystemExit('verify-p3 cue marker missing')
              s = s.replace(marker, marker + '  assert.strictEqual(audit.booleanIdCueWarnings.length, 0);\n')
          if '"boolean-id-cue-scan"' not in s:
              s = s.replace('      "boolean-answer-cue-scan",\n', '      "boolean-answer-cue-scan",\n      "boolean-id-cue-scan",\n')
          p.write_text(s)

      - name: Regenerate and verify
        run: |
          cd calibration
          npm run generate-probes:stage1
          npm run typecheck
          npm run verify:p3
          npx ts-node src/calibration-runner.ts --backend=mock-noop --budgets=0 --tasks=T-local-1 --probe-bank=stage1
          cd ../harness
          npm run typecheck
          cd ../synthetic-world
          npm test -- --runInBand
      - name: Commit repaired P6 measurement path
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/p6-probe-id-leak-fix.yml .github/workflows/p6-probe-id-leak-fix2.yml
          git add calibration/src/stage1-probes.ts calibration/verify-p3-measurement.ts calibration/fixtures/probe-bank-stage1.json calibration/fixtures/probe-bank-stage1.audit.json harness/p6-preflight-live.ts
          git commit -m 'fix(p6): remove boolean probe ID leakage'
          git push
