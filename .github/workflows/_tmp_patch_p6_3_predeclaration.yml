name: Temporary P6-3 predeclaration patch

on:
  push:
    branches:
      - docs/p6-2-findings-p6-3-prefreeze

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/p6-2-findings-p6-3-prefreeze
          fetch-depth: 0
      - name: Patch stage1_plan P6-3 predeclaration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/stage1_plan.md')
          text = path.read_text()

          old = r'''### 10.3 P6-3：EL static exposure

複数static exposure budget：

\[
B_{expose} \in \{0,B_1,B_2,\ldots,AF\}
\]

でdose-response確認。

既存1K/2Kは候補であり、model/token-counter変更後に再freezeする。
'''

          new = r'''### 10.3 P6-3：EL static exposure — implementation前predeclaration

P6-3の目的は、Stage 1Aで用いるExposure-Limited（EL）のstatic exposure budgetを、**confirmatory contrastとは独立したcalibration dataだけ**から選択しfreezeすることである。P6-2で得たAF baselineの結果を踏まえて測定器の特性は記録するが、P6-3 calibration後にprompt / parser / endpoint定義を都合よく変更しない。

#### 10.3.1 mutation/output contractはP6-2 AF baselineと同一versionで固定

P6-3のM測定では、少なくとも次をP6-2 AF baselineと**同一contract**として固定する。

- mutation prompt version：`stage1-worker-v3-moi`
- mutation prompt SHA-256：`20414dd374223bfacc16338877af9905d19501ea635752e04f34edc657560a51`
- mutation schema version：`repository-mutation-v2`
- mutation schema SHA-256：`27a144e12453d0422f3ce274684feb1818f894fe25217b33071416f6db8dcaa3`
- failure classification：`p6-1-failure-domain-v3`
- duplicate modified pathをprotocol failureとしてrejectするparser semantics
- repository contract外write / `workingNote` mutation等をprotocol failureとして扱うvalidation semantics
- `none / semantic / protocol / system / infrastructure / other`のscientific denominator / audit semantics

P6-2ではprimary Mの14 failureがすべてprotocolで、M stream全体では19 protocol failure中18件がduplicate modified pathだったため、serialization/parserを改善したくなる余地がある。しかし、**P6-3だけでprotocol failure率を改善するprompt / schema / parser / validation変更は禁止する。** これらを変更する場合は新しいversionとして扱い、旧AF baselineと直接比較せず、AFを含む全比較条件を同一contractで再baselineしてからStage 1Aへ進む。

refactor等でsource file hashが変わってもscientific semanticsが同一だと主張する場合は、旧/new contractのbehavioral equivalenceをoffline fixtureで機械検証し、version/hash/provenanceを明示する。黙示的なparser driftは許可しない。

#### 10.3.2 candidate budget gridとnested static exposure

P6-3 live calibration開始前に、fixed artifact \(S_0\) の全static artifact evidenceを、P3でfreezeしたcanonical serialization / tokenizerで数えたtoken数を

\[
T_{full}
\]

とする。finite candidate budgetはoutcomeを見ず、次の相対gridから機械的に導出する。

\[
B_1=\lfloor0.25T_{full}\rfloor,\qquad
B_2=\lfloor0.50T_{full}\rfloor,\qquad
B_3=\lfloor0.75T_{full}\rfloor
\]

calibration treatmentsは

\[
\mathcal B_{cal}=\{0,B_1,B_2,B_3,AF\}
\]

の5条件とする。旧Stage 0.5の1K/2K/4K/8Kはhistorical calibrationとして保持するが、P6-3のbudget単位へそのまま流用しない。

static selectorは各evaluation unitについて**一つのdeterministic ranked ArtifactUnit列を先に作り、各budgetではそのprefixだけを採用**する。したがって有限budgetについては原則として

\[
E(B_1)\subseteq E(B_2)\subseteq E(B_3)
\]

を構造的に保証する。budget境界でArtifactUnitを途中切断して別内容へ変形せず、target token数以下に収まる最長prefixを採用する。chunk granularityのため25/50/75% targetが同一prefixへcollapseする場合は、**live outcomeを見る前に**deterministic chunkingを細分化して3つのfinite treatmentがdistinctになるようengineering preflightで修正し、そのchunking versionをfreezeする。outcomeを見た後のbudget/grid変更は禁止する。

Mではtaskごとにprivileged relevance rankingが異なってよいが、**同一task内では0/B1/B2/B3/AFでrankingを再計算せず、一つのrankingのnested prefixを使う。** Rsemについては§10.3.7のbank-level static exposure規則を用いる。

#### 10.3.3 calibration repeat数とbudget-order counterbalance

P6-3 budget calibrationのrepeat数は、P6-2で科学比較用にfreezeした`N=21`から独立に、

\[
N_{cal}=10
\]

bank-level repeatsへ事前固定する。`N_cal=10`はconfirmatory powerを保証するためではなく、5 budget treatmentの順序を完全にcounterbalanceしつつbudget選択のengineering/calibration signalを得るための値である。P6-3 calibration結果を見て追加repeatしない。

5 treatmentを `1=0, 2=B1, 3=B2, 4=B3, 5=AF` と置き、odd-treatment Williams designとして次の10順序をfreezeする。

1. `0 → B1 → AF → B2 → B3`
2. `B1 → B2 → 0 → B3 → AF`
3. `B2 → B3 → B1 → AF → 0`
4. `B3 → AF → B2 → 0 → B1`
5. `AF → 0 → B3 → B1 → B2`
6. `B3 → B2 → AF → B1 → 0`
7. `AF → B3 → 0 → B2 → B1`
8. `0 → AF → B1 → B3 → B2`
9. `B1 → 0 → B2 → AF → B3`
10. `B2 → B1 → B3 → 0 → AF`

これにより各budgetは各ordinal positionへ2回ずつ現れ、異なるbudget間の各ordered predecessor pairも2回ずつ現れる。固定 `0→B1→B2→B3→AF` 順でprovider drift / fatigue / temporal effectをbudget effectへ重ねない。実行時のsequence IDをresult provenanceへ保存する。

#### 10.3.4 P6-3 calibration dataとStage 1A confirmatory dataを分離

P6-3の10-repeat calibration sampleは、**budget選択専用**である。選択されたbudgetを \(B^*_{expose}\) とした後、Stage 1A confirmatory EL outcomeはfresh agent / fresh API callで新規取得する。

- P6-3 calibration repeatをStage 1Aの`N=21`へpoolしない
- P6-3内のAF treatmentもP6-2 AF baselineやStage 1A paired AF sampleの代替にしない
- P6-2 AF baselineの21 repeatsもP6-3 calibration repeatとして数えない
- Stage 1Aでは事前freeze済みscientific repeat count `N=21`とpaired designを用い、selected \(B^*_{expose}\) でELを改めて実行する
- budget選択に使ったoutcomeと、C1〜C3のconfirmatory effect estimateを同じsampleから作らない

P6-3 calibrationはStage 1A outcomeを先取りするための小規模本実験ではなく、treatment levelを固定する独立phaseとして扱う。

#### 10.3.5 budget selection rule：Rsem primary / M guardrail

P6-2 AF baselineではMのsemantic-evaluable subsetが217/217 passである一方、aggregate Mの残差は主としてmutation-output protocolに由来した。これに対しRsemはstatic artifact exposureへの意味的再構成感度を直接測る。したがって**P6-3のbudget選択ではRsemをprimary selection endpoint、Mをnon-floor guardrail + secondary tie-break**として事前固定する。P6-3 outcomeを見た後にこの優先順位を変更しない。

各budget \(b\) の10-repeat calibration平均を \(\bar M_b,\bar R_b\) とする。Mはfrozen end-to-end failure semantics、Rsemはprotocol-valid semantic accuracyで集計する。選択用operational marginは既存の

\[
\Delta_M=1/11,\qquad\Delta_R=1/12
\]

を用いるが、`N_cal=10`で正式TOST equivalenceを主張するためではない。ここでの`floor-separated` / `AF-separated` / `AF-like`は**budget calibration用のpoint-estimate label**であり、confirmatory equivalence claimではない。

finite budget \(b\in\{B_1,B_2,B_3\}\) について：

\[
F_M(b): \bar M_b-\bar M_0\ge\Delta_M
\]

\[
F_R(b): \bar R_b-\bar R_0\ge\Delta_R
\]

\[
A_M(b): \bar M_{AF}-\bar M_b\ge\Delta_M
\]

\[
A_R(b): \bar R_{AF}-\bar R_b\ge\Delta_R
\]

と定義する。

1. **joint viability**：`F_M(b) && F_R(b)`。M/RsemのどちらかがB=0近傍へ張り付くbudgetはprimary候補にしない。
2. **non-degenerate**：joint viableかつ `A_M(b) || A_R(b)`。両endpointともAFとの差がmargin未満のbudgetはcalibration上`AF-like`とし、有限context treatmentとして選ばない。
3. **Rsem-primary candidate**：joint viableかつ`A_R(b)`。1つ以上あれば、\(\bar R_b\) が \((\bar R_0+\bar R_{AF})/2\) に最も近いbudgetを選ぶ。
4. Rsem midpoint distanceが同値なら、\(\bar M_b\) が \((\bar M_0+\bar M_{AF})/2\) に近い方を選ぶ。それも同値なら**小さいbudget**を選ぶ。
5. Rsem-primary candidateが0だが、joint viableかつ`A_M(b)`を満たすbudgetがある場合のみ**M-based fallback**を許す。\(\bar M_b\) のmidpoint distance最小、同値なら小さいbudgetを選び、`Rsem saturated across viable finite grid`というlimitationを明示する。
6. finite budgetにjoint viableが1つもない場合は`needs-audit: el-calibration-floor-or-endpoint-conflict`として停止し、budgetをfreezeしない。
7. joint viableは存在するが全て`!A_M && !A_R`なら`needs-audit: el-calibration-af-equivalent-grid`として停止し、budgetをfreezeしない。
8. 6/7で停止した場合、同じcalibration outcomeを見ながらgridを継ぎ足さない。新しいbudget grid / selector versionを別predeclarationとして作り、旧sampleはdiagnostic evidenceとして保持する。

unresolved audit flagが残るcalibration runからbudgetを選ばない。infrastructure-invalid replacementやsystem/other adjudicationはP6-2と同じ事前failure semanticsに従い、結果を見た人間が特定budgetだけを恣意的に再実行しない。

#### 10.3.6 M semantic failure rateはsecondary diagnosticに固定

P6-3以降、primary M outcomeは従来どおり**end-to-end task pass rate**であり、semantic failureだけへprimary endpointを差し替えない。一方、AF baselineでsemantic-evaluable subsetがceilingだったため、context制限でsemantic failureが新たに現れるかは重要なmechanism diagnosticとして保存する。

primary task bankについて

\[
SemanticFailureRate_M
=\frac{n_{semantic}}{n_{none}+n_{semantic}}
\]

をsecondary diagnosticとして出力する。`protocol`はsemantic correctness未観測なのでこのsemantic denominatorから除外し、protocol failure rateを別に併記する。

**P6-3 outcomeを見た後にSemanticFailureRateをprimary endpointへ格上げしない。** 将来primary endpoint化する場合は次versionの研究計画として事前登録し、新規sampleで検証する。

#### 10.3.7 Rsemは12-probe bank全体に対する単一static exposureを用いる

ELのRsem評価では、probeごとにoracle / ground-truth relevanceを使って別contextを作らない。各budget / repeatについて、12 probe bank全体に対する**一つのdeterministic bank-level rankingと一つのstatic exposure set**を先に作り、12 probeすべてへ同じsetを提示する。

- `E_R(B1) ⊆ E_R(B2) ⊆ E_R(B3)`をprefix構造で保証する
- probe-wise oracle contextは禁止
- aggregate Rsem primaryは12 probe全体のまま維持する
- `A-obfuscated-bool-r11`を含む12 probe membershipをP6-2後に変更しない
- aggregate accuracyに加えて**全12 probeのprobe-wise correct/attempted/accuracyを必須diagnosticとして保存**する
- 特にr11がbudget dose-responseを単独で支配するか、他probeへ誤答が広がるかを明示する
- r11除外集計を行う場合はpost-hoc sensitivity analysisと明記し、primary Rsemや`Delta_R=1/12`を置き換えない

このsingle-set ruleはP6-3だけでなく、EL/PR/ARを比較する後続analysisでもaggregate + probe-wise diagnosticを共通reporting contractとする。PR/ARはdynamic retrieval条件なのでexposure mechanism自体は異なるが、probe-wise outcome保存義務は共通とする。

#### 10.3.8 implementation / live execution review gate

本節§10.3.1〜§10.3.7を**EL runtime実装より前のpredeclaration**とする。次の順序を守る。

1. 本predeclarationをhuman review
2. reviewで承認された内容をversion/hash付き定数・offline verifierへ実装
3. nested exposure / single Rsem set / Williams order / selection ruleのoffline fixtureをCIでgreen化
4. その後にのみEL live calibrationを開始

**このreview gate完了前はEL runtime実装にもlive P6-3にも着手しない。**
'''

          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one P6-3 block, found {text.count(old)}')
          text = text.replace(old, new)

          old_status = '42. **P6-3** EL static dose-response ← 次'
          new_status = '42. **P6-3** EL static dose-response ← predeclaration記録済み / human review gate（EL runtime未着手）'
          if text.count(old_status) != 1:
              raise SystemExit(f'expected exactly one P6-3 status line, found {text.count(old_status)}')
          text = text.replace(old_status, new_status)

          path.write_text(text)
          PY

