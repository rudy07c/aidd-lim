name: P3 Regenerate Fixture Once

on:
  push:
    paths:
      - '.github/workflows/p3-regenerate-fixture-once.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: calibration/package-lock.json
      - name: Install calibration dependencies
        working-directory: calibration
        run: npm ci
      - name: Regenerate Stage 1 probe fixture
        working-directory: calibration
        run: npm run generate-probes:stage1 | tee /tmp/stage1-probe-audit.log
      - name: Verify interleave and per-batch balance
        working-directory: calibration
        run: |
          node <<'NODE'
          const fs = require('fs');
          const probes = JSON.parse(fs.readFileSync('fixtures/probe-bank-stage1.json', 'utf8'));
          const booleans = probes.filter(p => p.type === 'boolean');
          const labels = booleans.map(p => p.correctAnswer);
          if (labels.length === 0) throw new Error('No boolean probes found');
          for (let i = 0; i < labels.length; i++) {
            const expected = i % 2 === 0;
            if (labels[i] !== expected) {
              throw new Error(`Boolean interleave violated at boolean index ${i}: expected=${expected}, actual=${labels[i]}`);
            }
          }
          const BATCH_SIZE = 20;
          const batches = [];
          for (let start = 0, batchIndex = 0; start < probes.length; start += BATCH_SIZE, batchIndex++) {
            const batchBooleans = probes.slice(start, start + BATCH_SIZE).filter(p => p.type === 'boolean');
            const t = batchBooleans.filter(p => p.correctAnswer === true).length;
            const f = batchBooleans.filter(p => p.correctAnswer === false).length;
            if (t !== f) throw new Error(`Batch ${batchIndex} boolean labels imbalanced: true=${t}, false=${f}`);
            batches.push({ batchIndex, booleanTrue: t, booleanFalse: f });
          }
          console.log(JSON.stringify({
            fixtureProbeCount: probes.length,
            booleanProbeCount: booleans.length,
            booleanLabelOrder: labels.map(v => v ? 'true' : 'false'),
            batchBooleanBalance: batches,
            interleaveVerified: true,
          }, null, 2));
          NODE
      - name: Show generated diff
        run: git diff -- calibration/fixtures/probe-bank-stage1.json
      - name: Commit regenerated fixture and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calibration/fixtures/probe-bank-stage1.json
          git rm .github/workflows/p3-regenerate-fixture-once.yml
          git commit -m "test: regenerate interleaved Stage 1 probe fixture"
          git push
