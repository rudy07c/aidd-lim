name: Temp harden P6 findings verifier

on: [push]

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/docs/p6-2-findings-p6-3-prefreeze' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/p6-2-findings-p6-3-prefreeze
          fetch-depth: 0
      - name: Apply verifier hardening
        run: python .github/_temp_harden_p6_findings_verifier.py
      - name: Commit and remove temporary helpers
        run: |
          rm .github/_temp_harden_p6_findings_verifier.py
          rm .github/workflows/temp-harden-p6-findings-verifier.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: pin exact P6-2 postflight findings"
          git push origin HEAD:docs/p6-2-findings-p6-3-prefreeze
