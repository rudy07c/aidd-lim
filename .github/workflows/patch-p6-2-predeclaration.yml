name: Patch P6-2 predeclaration

on:
  push:
    paths:
      - '.github/p6_2_predeclaration_trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand Stage 1 P6-2 predeclaration
        run: python .github/patch_p6_2_predeclaration.py
      - name: Validate docs-only diff
        run: |
          git diff --check
          test "$(git diff --name-only)" = "docs/stage1_plan.md"
      - name: Commit documentation only
        run: |
          git config user.name 'rudy07c'
          git config user.email 'rudy07c@gmail.com'
          git add docs/stage1_plan.md
          git commit -m 'docs(stage1): predeclare P6-2 AF baseline'
          git push
