name: Patch P4 accounting contract docs

on:
  push:
    paths:
      - '.github/workflows/p4-accounting-doc-patch.yml'

permissions:
  contents: write

jobs:
  patch-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Stage 1 plan accounting contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/stage1_plan.md')
          text = path.read_text()

          old_54 = '''大きな1 fileだけで \\(B_{work}\\) を超えることを避けるためchunk readを前提にする。'''
          new_54 = '''`ArtifactUnit.tokenCount` はcontent単体ではなく、**modelへ実際に提示するartifact evidence全体**をcanonical tokenizerで数えた値とする。model-visible serializationは `serializeArtifactUnitForWorkingSet(unit)` に一元化し、初版では `path + line range + content` を提示する。`kind` はharness側のprovenance / selector metadataでありmodel-visible evidenceには含めない。\n\n大きな1 fileだけで \\(B_{work}\\) を超えることを避けるためchunk readを前提にする。chunk capも同じmodel-visible serialization全体に対して適用する。'''
          if old_54 not in text:
              raise SystemExit('P3 ArtifactUnit anchor not found')
          text = text.replace(old_54, new_54, 1)

          old_62 = '''### 6.2 \\(B_{work}\\) に含める\n\n- active artifact chunks\n- retained search/listing artifact evidence\n- explicit working note / summary\n- task遂行のためagentがpersistentに保持する明示的repository-derived memory'''
          new_62 = '''### 6.2 \\(B_{work}\\) に含める\n\n\\(B_{work}\\) は**model-visible artifact evidence tokens**として定義する。artifact contentだけを数えるのではなく、modelがevidenceを解釈するため実際に提示されるrepository-derived framingも含める。`ArtifactUnit`では `serializeArtifactUnitForWorkingSet(unit)` を唯一の会計・提示形式とし、初版は `path + line range + content` をcanonical token countする。`kind` はmodelへ提示しないharness-side provenanceなので算入しない。\n\n- active artifact chunks（path + line range + contentのmodel-visible serialization全体）\n- retained search/listing artifact evidence（modelへ提示されるserialization全体）\n- explicit working note / summary\n- task遂行のためagentがpersistentに保持する明示的repository-derived memory\n\n`WorkingSetManager`はこの会計の唯一のbudget authorityとし、`ArtifactUnit.tokenCount`の自己申告値も同じserializationから再計算して検証する。provider backendによる二重truncateは引き続き禁止する。'''
          if old_62 not in text:
              raise SystemExit('P4 B_work anchor not found')
          text = text.replace(old_62, new_62, 1)

          path.write_text(text)
          PY
      - name: Remove temporary workflow and commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/p4-accounting-doc-patch.yml
          git add docs/stage1_plan.md
          git commit -m 'docs: freeze model-visible B_work accounting'
          git push
