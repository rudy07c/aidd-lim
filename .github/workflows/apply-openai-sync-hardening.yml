name: Apply OpenAI sync hardening

on:
  push:
    paths:
      - '.code-update/harden_openai_sync.py'
      - '.code-update/fix_openai_sync_hardening.py'
      - '.github/workflows/apply-openai-sync-hardening.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: harness/package-lock.json
      - name: Apply hardening
        run: |
          python .code-update/harden_openai_sync.py
          python .code-update/fix_openai_sync_hardening.py
      - name: Install dependencies
        working-directory: harness
        run: npm ci
      - name: Typecheck
        working-directory: harness
        run: npm run typecheck
      - name: Verify OpenAI backend offline
        working-directory: harness
        run: npm run verify:openai
      - name: Commit harness changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .code-update/harden_openai_sync.py
          git rm .code-update/fix_openai_sync_hardening.py
          git add harness
          git status --short
          git commit -m "fix: harden GPT-5.6 Luna sync backend"
          git push
