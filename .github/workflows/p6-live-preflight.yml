name: One-shot P6 plan sync

on:
  push:
    paths:
      - '.github/workflows/p6-live-preflight.yml'

permissions:
  contents: write

jobs:
  sync-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add P6-0 and align P6 numbering
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/stage1_plan.md')
          s = p.read_text()
          anchor = '## 10. Pre-Stage 1 / P6：再較正\n\n'
          if '### 10.0 P6-0：Probe bank再検証' not in s:
              block = '''### 10.0 P6-0：Probe bank再検証（F5/F9・Luna）\n\nPrimary modelをGPT-5.6 Lunaへ移行し、Synthetic World / probe bankもStage 1向けに拡張されたため、task eligibility判定へ入る前に`calibration/fixtures/probe-bank-stage1.json`自体の測定妥当性をlive APIで再確認する。\n\n事前に固定する確認：\n\n- static auditでboolean主指標が24問（true 12 / false 12）のbalanced設計を維持し、`f5Warnings=[]`・raw Ground Truth ID leakageなしであること\n- Luna × B=0を3 repeatし、boolean主指標の平均accuracyがchance近傍（engineering gate: 0.35〜0.65）にあること\n- Luna × B=1K / Fullを3 repeatし、Full平均accuracy >= 0.85かつFull−B=0 >= 0.25の感度を持つこと\n- visible-tests-only ablationを3 repeatし、boolean平均が0.65以下かつB=0平均+0.15を超えないこと。超える場合はF5型のvisible-test leakageとしてprobe bankをP6-1前に修正する\n- `protocol_adapter.ts` only ablationとB=1Kでmc/stp reference probeを確認し、F9型のoperationTable / naming-pattern inferenceがLunaでも再現するかを記録する\n\nmc/stpは既にreference-onlyであり、F9再現それ自体はboolean主指標のgate failureとはしない。ただしreferenceとしての解釈を超えてprimary判定へ混入させない。boolean側にF5/F9由来の非context情報が見つかった場合はP6-1へ進まずprobe bankを修正する。\n\n**Gate P6-0**\n\n- balanced/static leakage auditがclean\n- boolean B=0がchance近傍\n- booleanがB=0→Fullで十分なdose-responseを持つ\n- visible-tests-onlyでbooleanのF5 leakageが観測されない\n- mc/stpのF9挙動がreference diagnosticとして記録される\n\n'''
              if anchor not in s: raise SystemExit('P6 anchor missing')
              s = s.replace(anchor, anchor + block, 1)
          replacements = [
            ('### 10.0 Primary task eligibility', '### 10.1 P6-1：Primary task eligibility'),
            ('### 10.0.1 Luna capability-floor gate', '### 10.1.1 Luna capability-floor gate'),
            ('### 10.1 AF baseline', '### 10.2 P6-2：AF baseline'),
            ('### 10.2 EL static exposure', '### 10.3 P6-3：EL static exposure'),
            ('### 10.3 PR working-set dose-response', '### 10.4 P6-4：PR working-set dose-response'),
            ('### 10.4 AR smoke / non-floor', '### 10.5 P6-5：AR smoke / non-floor'),
            ('### 10.5 MOI serialization preflight', '### 10.6 P6-6：MOI serialization preflight'),
            ('### 10.6 freeze', '### 10.7 P6-7：freeze'),
          ]
          for old,new in replacements:
              if old in s: s = s.replace(old,new,1)
          old = '''### Phase P6：Recalibration\n\n38. AF baseline\n39. EL static dose-response\n40. PR working-set dose-response\n41. AR smoke/non-floor\n42. MOI serialization + source-tagging preflight\n43. Operational-Full feasibility preflight\n44. \\(B_{expose}\\) freeze\n45. \\(B_{work}\\) freeze\n46. \\(E_{max}\\) freeze\n47. MOI schema/size freeze\n48. equivalence margins\n49. variance / repeats freeze\n'''
          new = '''### Phase P6：Recalibration\n\n38. **P6-0** Luna probe-bank revalidation（F5/F9、B=0/B=1K/Full、tests-only、adapter-only）\n39. **P6-1** Primary task eligibility + Luna capability-floor pilot / classification\n40. **P6-2** AF baseline\n41. **P6-3** EL static dose-response\n42. **P6-4** PR working-set dose-response\n43. **P6-5** AR smoke/non-floor\n44. **P6-6** MOI serialization + source-tagging / Operational-Full feasibility preflight\n45. **P6-7** \\(B_{expose}\\) freeze\n46. \\(B_{work}\\) freeze\n47. PR/AR共通 \\(E_{max}\\) freeze\n48. MOI schema/size freeze\n49. equivalence margins\n50. variance / repeats freeze\n'''
          if old not in s: raise SystemExit('Phase P6 list not found')
          s = s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit plan and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/p6-live-preflight.yml
          git add docs/stage1_plan.md
          git diff --cached --check
          git commit -m 'docs(p6): add P6-0 probe-bank revalidation gate'
          git push origin HEAD:main
