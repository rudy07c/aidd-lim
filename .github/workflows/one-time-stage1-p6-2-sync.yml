name: One-time Stage 1 P6-2 documentation sync

on:
  push:
    branches:
      - evidence/p6-2-af-baseline
    paths:
      - '.github/workflows/one-time-stage1-p6-2-sync.yml'

permissions:
  contents: write

jobs:
  patch-stage1-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evidence/p6-2-af-baseline
      - name: Apply exact P6-2 completion updates
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/stage1_plan.md')
          text = path.read_text()

          def replace_exact(old: str, new: str, expected: int = 1):
              global text
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'expected {expected} occurrences, found {count}: {old[:120]!r}')
              text = text.replace(old, new)

          replace_exact(
              '**対象**：`docs/experiment_plan.md`（v2.6）の Stage 1「Inheritance / Context Decomposition」',
              '**対象**：`docs/experiment_plan.md`（v2.9）の Stage 1「Inheritance / Context Decomposition」'
          )
          replace_exact(
              '2. `docs/experiment_plan.md`（v2.6）',
              '2. `docs/experiment_plan.md`（v2.9）'
          )
          replace_exact(
              'P6-1b時点の`capabilityClass`と`analysisRole`はhistorical classificationとして保持する。ただし2026-09-21のpost-pilot bank-wide再監査（§10.2.5b）により、P6-2以降のeffective bankでは`T-crosscut-5`をsemantic-floorへ再分類する。このamendment以外に、P6-2の結果を見た任意のtask再選別は行わない。',
              'P6-1b時点の`capabilityClass`と`analysisRole`はhistorical classificationとして保持する。2026-09-21のpost-pilot bank-wide再監査（§10.2.5b）では、`T-crosscut-5`をhistorical `semantic-floor`へ遡及再分類せず、P6-2+専用の`post-pilot-low-headroom`としてprimary Mから除外した。このamendment以外に、P6-2の結果を見た任意のtask再選別は行わない。'
          )
          replace_exact(
              'P6-1b historical floor 6 taskにpost-pilot再分類の`T-crosscut-5`を加えた7 task、',
              'P6-1b historical semantic-floor 6 taskと、別分類のpost-pilot-low-headroom `T-crosscut-5`からなる7 task、'
          )

          marker = '### 10.3 P6-3：EL static exposure'
          completion = '''#### 10.2.8 P6-2 completion record（2026-09-22）\n\nfreeze済み`N=21`を用い、GPT-5.6 Luna / reasoning=`high` / Artifact-FullでAF baseline本取得を完了した。source git SHAは`0a0fd1a262c2e4274f1b946562c9b4e79f6fb71b`、正式evidenceは`docs/findings/evidence/p6-2-af-baseline/result.json`、SHA-256は`b7b0e3f9598b034548b8466258a0aae54916fcdfa2ef0f53f9f85636272c7801`である。\n\nprimary Mは11 task × 21 repeat = **231/231がscientifically valid**で、217 pass / 14 failure、`passRate=0.9393939394`。primary側のaudit exclusionは0で、14 failureはすべて`protocol`、`semantic/system/infrastructure/other`は0だった。したがって後続conditionでMが低下した場合も、その差を自動的にsemantic reconstruction lossとは解釈せず、failure domainを分解して報告する。\n\neligible diagnostic 2 taskは42 repeat中41がscientifically validで36 pass。`T-invariant-stress-3` repeat 19でOpenAI API credit exhaustionによるHTTP 429が発生したが、`actualModel=null`かつusage=0のprovider-side実行不能だったため`infrastructure-invalid`としてadjudicateした。同一runをresumeして完走し、最終unresolved audit flagは0である。\n\nRsemは`stage1-neutral-relation-v2`の12 balanced boolean probeを21 repeat実行し、235/252=`0.9325396825`。21/21 repeatがprotocol-validで、protocol reliability=`1.0`。4 repeatが12/12、17 repeatが11/12であり、高いAF baselineだが全repeatが1.0へ張り付く完全飽和ではない。最終stored estimated costは`$0.7923262`。\n\n以上によりP6-2 completion conditionは通過した。**P6-2観測後にtask membership、`Delta_M=1/11`、`Delta_R=1/12`、`N=21`を再調整しない。** 次phaseはP6-3 EL static dose-responseとする。\n\n'''
          replace_exact(marker, completion + marker)

          replace_exact(
              '41. **P6-2** AF baseline ← 次\n42. **P6-3** EL static dose-response',
              '41. **P6-2** AF baseline ✅ 2026-09-22完了（N=21、primary M=217/231、Rsem=235/252、unresolved audit=0）\n42. **P6-3** EL static dose-response ← 次'
          )

          path.write_text(text)
          PY

          git diff --check
          git diff -- docs/stage1_plan.md
      - name: Commit synchronized Stage 1 plan
        run: |
          if git diff --quiet -- docs/stage1_plan.md; then
            echo 'No change to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/stage1_plan.md
          git commit -m 'docs(stage1): close P6-2 and advance to P6-3'
          git push origin HEAD:evidence/p6-2-af-baseline
