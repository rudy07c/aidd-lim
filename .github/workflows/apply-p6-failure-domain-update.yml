name: Apply P6 failure-domain update

on:
  push:
    paths:
      - '.github/workflows/apply-p6-failure-domain-update.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        shell: bash
        run: echo '' | base64 -d | python3
      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harness/p6-preflight-live.ts harness/package.json .github/workflows/harness-ci.yml docs/stage1_plan.md
          git diff --cached --check
          git commit -m "fix(p6): separate semantic and protocol failures"
          git push
