name: P3 Tokenizer Dependency Update

on:
  push:
    paths:
      - '.github/workflows/p3-tokenizer-deps.yml'

permissions:
  contents: write

jobs:
  update-locks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add canonical tokenizer to harness
        working-directory: harness
        run: npm install js-tiktoken@1.0.21 --save
      - name: Add canonical tokenizer to calibration
        working-directory: calibration
        run: npm install js-tiktoken@1.0.21 --save
      - name: Commit generated manifests and lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harness/package.json harness/package-lock.json calibration/package.json calibration/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes needed."
            exit 0
          fi
          git commit -m "chore: add canonical tokenizer dependency"
          git push
