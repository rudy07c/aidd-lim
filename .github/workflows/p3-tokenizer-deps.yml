name: P3 Calibration Runner Wiring

on:
  push:
    paths:
      - '.github/workflows/p3-tokenizer-deps.yml'

permissions:
  contents: write

jobs:
  patch-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wire Stage 1 probe bank and canonical accounting
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              actual = text.count(old)
              if actual != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, got {actual}: {old[:90]!r}')
              return text.replace(old, new, 1)

          p = Path('calibration/src/calibration-runner.ts')
          s = p.read_text()
          replacements = [
            ('export type CalibrationBackend = "mock-noop" | "mock-oracle" | "anthropic";\n',
             'export type CalibrationBackend = "mock-noop" | "mock-oracle" | "anthropic";\nexport type ProbeBankMode = "legacy" | "stage1";\n'),
            ('  /** 実行するtaskIdのリスト。省略時は全タスク */\n  taskFilter?: string[];\n',
             '  /** 実行するtaskIdのリスト。省略時は全タスク */\n  taskFilter?: string[];\n  /** legacy keeps Stage 0.5 reproducibility; Stage 1/P6 must explicitly select stage1. */\n  probeBank?: ProbeBankMode;\n'),
            ('  contextTokens: number;\n  numCorrect: number;\n',
             '  /** Stage 0.5 historical char/4 approximation. */\n  contextTokens: number;\n  /** Stage 1 canonical o200k_base content tokens. */\n  canonicalContextTokens: number;\n  numCorrect: number;\n'),
            ('export interface System2BudgetResult {\n  budget: BudgetValue;\n  contextTokens: number;\n',
             'export interface System2BudgetResult {\n  budget: BudgetValue;\n  /** Stage 0.5 historical char/4 approximation. */\n  contextTokens: number;\n  /** Stage 1 canonical o200k_base content tokens. */\n  canonicalContextTokens: number;\n'),
            ('export interface CalibrationRunResult {\n  backend: CalibrationBackend;\n',
             'export interface CalibrationRunResult {\n  backend: CalibrationBackend;\n  probeBank: ProbeBankMode;\n'),
            ('    contextTokens: ctx.totalTokens,\n    numCorrect: summary.correct,\n',
             '    contextTokens: ctx.totalTokens,\n    canonicalContextTokens: ctx.canonicalTokens,\n    numCorrect: summary.correct,\n'),
            ('  const contextTokens = ctx.totalTokens;\n',
             '  const contextTokens = ctx.totalTokens;\n  const canonicalContextTokens = ctx.canonicalTokens;\n'),
            ('    contextTokens,\n    passRate: tasks.length > 0 ? numPassed / tasks.length : 0,\n',
             '    contextTokens,\n    canonicalContextTokens,\n    passRate: tasks.length > 0 ? numPassed / tasks.length : 0,\n'),
            ('  const { backend, budgets = ALL_BUDGETS, model = "claude-haiku-4-5-20251001", taskFilter } = options;\n',
             '  const { backend, budgets = ALL_BUDGETS, model = "claude-haiku-4-5-20251001", taskFilter, probeBank = "legacy" } = options;\n'),
            ('  const probes: GeneratedProbe[] = JSON.parse(\n    fs.readFileSync(path.join(calibrationDir, "fixtures/probe-bank.json"), "utf8")\n  );\n',
             '  const probeBankFile = probeBank === "stage1" ? "probe-bank-stage1.json" : "probe-bank.json";\n  const probes: GeneratedProbe[] = JSON.parse(\n    fs.readFileSync(path.join(calibrationDir, "fixtures", probeBankFile), "utf8")\n  );\n'),
            ('  return { backend, system1, system2 };\n',
             '  return { backend, probeBank, system1, system2 };\n'),
            ('  const tasksArg = getArg("tasks");\n',
             '  const tasksArg = getArg("tasks");\n  const probeBankArg = getArg("probe-bank");\n'),
            ('  const model = modelArg ?? "claude-haiku-4-5-20251001";\n',
             '  const model = modelArg ?? "claude-haiku-4-5-20251001";\n  const probeBank: ProbeBankMode = probeBankArg === "stage1" ? "stage1" : probeBankArg === undefined || probeBankArg === "legacy" ? "legacy" : (() => { throw new Error(`Invalid probe-bank: ${probeBankArg}`); })();\n'),
            ('  console.log(`  budgets: ${budgets.join(", ")}`);\n',
             '  console.log(`  budgets: ${budgets.join(", ")}`);\n  console.log(`  probe bank: ${probeBank}`);\n'),
            ('  runCalibration({ backend, model, budgets, taskFilter: taskFilter ?? undefined }).then((result) => {\n',
             '  runCalibration({ backend, model, budgets, taskFilter: taskFilter ?? undefined, probeBank }).then((result) => {\n'),
          ]
          for i, (old, new) in enumerate(replacements):
              s = replace_once(s, old, new, f'runner replacement {i}')
          p.write_text(s)

          p = Path('calibration/src/calibration-logging.ts')
          s = p.read_text()
          replacements = [
            ('    backend: result.backend,\n    timestamp,\n',
             '    backend: result.backend,\n    probeBank: result.probeBank,\n    timestamp,\n'),
            ('    system1: result.system1.map((s1) => ({\n      budget: s1.budget,\n      contextTokens: s1.contextTokens,\n',
             '    system1: result.system1.map((s1) => ({\n      budget: s1.budget,\n      contextTokens: s1.contextTokens,\n      canonicalContextTokens: s1.canonicalContextTokens,\n'),
            ('    system2: result.system2.map((s2) => ({\n      budget: s2.budget,\n      contextTokens: s2.contextTokens,\n',
             '    system2: result.system2.map((s2) => ({\n      budget: s2.budget,\n      contextTokens: s2.contextTokens,\n      canonicalContextTokens: s2.canonicalContextTokens,\n'),
            ('  writeJson(dir, "meta.json", {\n    budget: s1.budget,\n    contextTokens: s1.contextTokens,\n',
             '  writeJson(dir, "meta.json", {\n    budget: s1.budget,\n    contextTokens: s1.contextTokens,\n    canonicalContextTokens: s1.canonicalContextTokens,\n'),
            ('  writeJson(budgetDir, "summary.json", {\n    budget: s2.budget,\n    contextTokens: s2.contextTokens,\n',
             '  writeJson(budgetDir, "summary.json", {\n    budget: s2.budget,\n    contextTokens: s2.contextTokens,\n    canonicalContextTokens: s2.canonicalContextTokens,\n'),
          ]
          for i, (old, new) in enumerate(replacements):
              s = replace_once(s, old, new, f'logging replacement {i}')
          p.write_text(s)
          PY
      - name: Install dependencies
        run: |
          (cd harness && npm ci)
          (cd calibration && npm ci)
          (cd synthetic-world && npm ci)
      - name: Verify changes
        run: |
          (cd harness && npm run typecheck)
          (cd calibration && npm run typecheck)
          (cd calibration && npm run verify:p3)
          (cd synthetic-world && npm test -- --runInBand)
      - name: Commit runner wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calibration/src/calibration-runner.ts calibration/src/calibration-logging.ts
          git commit -m "feat: wire Stage 1 measurement into calibration runner"
          git push
