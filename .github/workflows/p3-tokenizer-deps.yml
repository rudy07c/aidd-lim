name: P3 Stage 1 Probe Fixture

on:
  push:
    paths:
      - '.github/workflows/p3-tokenizer-deps.yml'

permissions:
  contents: write

jobs:
  generate-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install harness dependencies
        working-directory: harness
        run: npm ci
      - name: Install calibration dependencies
        working-directory: calibration
        run: npm ci
      - name: Generate balanced Stage 1 probe bank
        working-directory: calibration
        run: npm run generate-probes:stage1
      - name: Verify P3 measurement gate
        working-directory: calibration
        run: npm run verify:p3
      - name: Commit generated Stage 1 fixture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calibration/fixtures/probe-bank-stage1.json
          if git diff --cached --quiet; then
            echo "Fixture already up to date."
            exit 0
          fi
          git commit -m "test: add balanced Stage 1 probe bank fixture"
          git push
