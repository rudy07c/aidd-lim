name: Apply P6 review fixes

on:
  push:
    paths:
      - '.github/workflows/apply-p6-review-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fixes
        run: python3 .github/apply_p6_review_fixes.py
      - name: Verify diff
        run: git diff --check
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add harness/src/run-validity.ts harness/src/orchestrator.ts harness/src/p6/failure-classification.ts harness/src/p6/task-bank-eligibility.ts harness/p6-task-bank-eligibility-live.ts harness/verify-p6-failure-classification.ts harness/verify-p6-task-bank-eligibility.ts docs/stage1_plan.md
          git commit -m 'fix(p6): harden task-bank eligibility before live run'
          git push
